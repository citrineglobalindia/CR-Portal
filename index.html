<script>
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }); }
  var __deferredPrompt=null;
  function __installed(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
  function __showHdrInstall(){ var b=document.getElementById('hdr-install'); if(b && !__installed()) b.classList.remove('hidden'); }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); __deferredPrompt=e; __showHdrInstall();
    var f=document.getElementById('pwa-install'); if(!f){ f=document.createElement('button'); f.id='pwa-install'; f.className='pwa-install'; f.type='button'; f.innerHTML='⬇ Install app'; f.onclick=installApp; (document.body||document.documentElement).appendChild(f); } });
  window.addEventListener('appinstalled', function(){ __deferredPrompt=null; var b=document.getElementById('pwa-install'); if(b) b.remove(); var h=document.getElementById('hdr-install'); if(h) h.classList.add('hidden'); });
  async function installApp(){
    if(__deferredPrompt){ __deferredPrompt.prompt(); try{ await __deferredPrompt.userChoice; }catch(_){} __deferredPrompt=null; var f=document.getElementById('pwa-install'); if(f) f.remove(); return; }
    var ua=navigator.userAgent||''; var iOS=/iphone|ipad|ipod/i.test(ua); var inApp=/(FBAN|FBAV|Instagram|WhatsApp|Line|Twitter|GSA)/i.test(ua);
    var steps = inApp ? 'You\'re in an in-app browser. Tap the ⋯ / share menu and choose <b>Open in browser</b> (Chrome or Safari), then use Install / Add to Home Screen.'
      : iOS ? 'On iPhone/iPad: tap the <b>Share</b> button (□↑) at the bottom, then choose <b>Add to Home Screen</b>.'
      : 'Open your browser menu (⋮) and choose <b>Install app</b> / <b>Add to Home screen</b>.';
    var ov=document.createElement('div'); ov.className='overlay'; ov.style.zIndex='200'; ov.onclick=function(ev){ if(ev.target===ov) ov.remove(); };
    ov.innerHTML='<div class="modal" style="max-width:400px"><div class="mh"><h2 style="margin:0">⬇ Install app</h2><button class="x" onclick="this.closest(\'.overlay\').remove()">×</button></div><div class="mb"><p style="line-height:1.6">'+steps+'</p></div></div>';
    document.body.appendChild(ov);
  }
  window.addEventListener('load', function(){ if(!__installed()) { var b=document.getElementById('hdr-install'); if(b) b.classList.remove('hidden'); } });
</script>
<style>
  :root{
    --bg:#0f1220; --panel:#171a2b; --panel2:#1e2238; --line:#2a2f4a;
    --txt:#e7e9f3; --muted:#9aa0bd; --brand:#6c5ce7; --brand2:#8e7cff;
    --accent:#00d2a8; --danger:#ff6b6b; --warn:#ffb020; --ok:#22c55e; --g1:rgba(108,92,231,.22); --g2:rgba(0,210,168,.14);
    --chip:#252a45; --shadow:0 10px 30px rgba(0,0,0,.35);
    --g1:rgba(108,92,231,.18); --g2:rgba(0,210,168,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%,var(--g1),transparent),
    radial-gradient(900px 500px at -10% 110%,var(--g2),transparent),var(--bg);
    color:var(--txt);min-height:100vh}
  a{color:var(--brand2)}
  .hidden{display:none!important}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:30px;box-shadow:var(--shadow)}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--accent));
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px}
  .logo h1{font-size:18px;margin:0}
  .logo small{color:var(--muted)}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .inp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:11px 12px;border-radius:10px;font-size:14px;outline:none}
  .inp:focus{border-color:var(--brand)}
  .btn{width:100%;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    padding:12px;border-radius:11px;font-weight:700;font-size:15px;margin-top:18px}
  .btn:disabled{opacity:.6}
  .btn-sm{width:auto;padding:8px 14px;font-size:13px;margin:0;border-radius:9px}
  .btn-ghost{background:var(--chip);color:var(--txt);border:1px solid var(--line)}
  .btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .msg{margin-top:14px;font-size:13px;padding:10px;border-radius:9px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(255,107,107,.12);color:#ffb4b4;border:1px solid rgba(255,107,107,.3)}
  .msg.ok{background:rgba(34,197,94,.12);color:#9af5c0;border:1px solid rgba(34,197,94,.3)}
  .setup-note{background:rgba(108,92,231,.12);border:1px solid rgba(108,92,231,.35);color:#cfc6ff;
    padding:10px 12px;border-radius:9px;font-size:12.5px;margin:8px 0 4px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;
    background:rgba(23,26,43,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:30}
  header.top .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .pill{background:var(--chip);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:12px}
  .pill.admin{background:rgba(108,92,231,.2);border-color:var(--brand);color:#cfc6ff}
  .wrap{max-width:1700px;margin:0 auto;padding:22px 40px}
  @media(max-width:900px){.wrap{padding:18px 16px}}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .navtabs{display:flex;gap:8px;margin-bottom:18px}
  .navtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px}
  .navtabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  @media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:linear-gradient(155deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--accent));opacity:.55}
  .stat .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;margin-bottom:12px}
  .stat .n{font-size:28px;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:12px;margin-top:4px}
  .welcome{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:linear-gradient(120deg,rgba(108,92,231,.28),rgba(0,210,168,.18));
    border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
  .welcome .w-hi{font-size:21px;font-weight:800}
  .welcome .w-sub{color:#c7cbe6;font-size:13px;margin-top:3px}
  .profile-banner{height:96px;background:linear-gradient(120deg,#6c5ce7,#00d2a8)}
  .profile-av{width:96px;height:96px;border-radius:50%;border:4px solid var(--panel);margin:-58px auto 0;
    overflow:hidden;display:grid;place-items:center;font-weight:800;color:#fff;font-size:34px;
    background:linear-gradient(135deg,var(--brand),var(--accent))}
  .profile-av img{width:100%;height:100%;object-fit:cover}
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
  .bcol{min-width:240px;flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}
  .bcol.over{border-color:var(--brand);background:rgba(108,92,231,.08)}
  .bcol-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
  .bcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;cursor:grab}
  .bcard:hover{border-color:var(--brand)}
  .bcard:active{cursor:grabbing}
  .bcard .bc-title{font-weight:600;font-size:13px;margin:4px 0}
  .bcard .bc-meta{color:var(--muted);font-size:11.5px;margin-top:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .inp{width:auto}
  .spacer{flex:1}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:rgba(255,255,255,.02)}
  #a-table table{font-size:14px;min-width:1080px}
  #a-table th,#a-table td{padding:12px 11px;vertical-align:middle}
  #a-table th{font-size:12px;white-space:nowrap}
  #a-table td .ref{font-size:14px}
  #a-table th:nth-child(1),#a-table td:nth-child(1){white-space:nowrap}
  #a-table th:nth-child(5),#a-table td:nth-child(5){white-space:nowrap}
  #a-table th:nth-child(6),#a-table td:nth-child(6){white-space:nowrap}
  #a-table td:nth-child(2){min-width:200px}
  #a-table td:nth-child(3){min-width:150px}
  .table-wrap{overflow-x:auto;border-radius:12px}
  #a-table select.inp{font-size:14px!important;padding:8px 10px!important}
  #a-table .btn-sm,#a-table .link-btn{font-size:14px;padding:8px 12px}
  .table-wrap{overflow-x:auto}
  .badge{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;display:inline-block}
  .b-New{background:rgba(154,160,189,.2);color:#c7cbe6}
  .b-InReview{background:rgba(255,176,32,.18);color:#ffd58a}
  .b-Approved{background:rgba(108,92,231,.22);color:#cfc6ff}
  .b-InProgress{background:rgba(0,210,168,.18);color:#86f5db}
  .b-Done{background:rgba(34,197,94,.18);color:#9af5c0}
  .b-Rejected{background:rgba(255,107,107,.18);color:#ffb4b4}
  .pr-High,.pr-Critical{color:#ff9b9b;font-weight:700}
  .pr-Medium{color:#ffd58a}
  .pr-Low{color:#9aa0bd}
  .ref{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);font-weight:700}
  .link-btn{background:none;border:0;color:var(--brand2);font-weight:600;padding:0}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .overlay{position:fixed;inset:0;background:rgba(5,6,15,.7);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
  .modal{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow)}
  .modal .mh{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--line)}
  .modal .mb{padding:22px}
  .modal .x{background:var(--chip);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:9px;font-size:18px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13.5px;margin-bottom:16px}
  .kv .k{color:var(--muted)}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 10px;border-top:1px solid var(--line);padding-top:16px}
  .comment{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
  .comment .meta{font-size:12px;color:var(--muted);margin-bottom:5px}
  .hist{font-size:13px;color:var(--muted);border-left:2px solid var(--brand);padding:4px 0 4px 12px;margin-bottom:8px}
  .att{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:8px 12px;margin-bottom:8px;font-size:13px}
  .att .name{flex:1}
  .photo-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .photo-grid a{display:block}
  .photo-grid img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .btn-ghost.rec{background:rgba(255,107,107,.2);border-color:var(--danger);color:#ffb4b4}
  audio{filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);padding:12px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:100;
    font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1;bottom:30px}
  .toast.err{border-color:var(--danger)}
  .req{color:var(--danger)}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .pw-wrap{position:relative}
  .pw-wrap .inp{padding-right:46px}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
    font-size:17px;line-height:1;color:var(--muted);padding:6px;cursor:pointer}
  .bell{position:relative;background:#fff;border:1px solid rgba(0,0,0,.06);color:#1e2333;
    width:40px;height:40px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.14);transition:transform .16s,box-shadow .2s}
  .bell:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.2)}
  .bell:active{transform:scale(.94)}
  .bell-badge{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;font-size:10px;
    font-weight:800;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .notif-modal{max-width:520px}
  .notif-list{max-height:70vh;overflow-y:auto}
  .notif-main{flex:1;min-width:0;cursor:pointer}
  .notif-read{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--chip);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;align-self:center}
  .notif-read:hover{background:rgba(34,197,94,.15);color:#22c55e;border-color:#22c55e66}
  .notif-empty{text-align:center;color:var(--muted);padding:36px 10px}
  .notif-empty .ne-ic{width:64px;height:64px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--muted)}
  /* profile page */
  .prof-page{max-width:460px;padding:0;overflow:hidden}
  .prof-hero{position:relative;background:linear-gradient(135deg,var(--brand),var(--accent));padding:30px 20px 24px;text-align:center;color:#fff}
  .prof-x{position:absolute;top:12px;right:14px;color:#fff;background:rgba(255,255,255,.18);border:0;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1}
  .prof-logo{width:92px;height:92px;border-radius:24px;background:#fff;margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.25);font-weight:800;color:var(--brand);font-size:30px}
  .prof-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
  .prof-name{font-size:20px;font-weight:800;line-height:1.2}
  .prof-tags{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .prof-tags .pill{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}
  .prof-body{padding:18px}
  .prof-list{display:flex;flex-direction:column;gap:2px}
  .prof-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .prof-row:last-child{border-bottom:0}
  .prof-ic{width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .prof-kv{min-width:0;flex:1}
  .prof-k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .prof-v{font-size:14.5px;font-weight:600;word-break:break-word}
  /* mobile bottom-sheet modals */
  @media(max-width:640px){
    .overlay-sheet{align-items:flex-end;padding:0}
    .notif-modal,.prof-page{max-width:100%;width:100%;border-radius:22px 22px 0 0;max-height:92vh}
    .notif-list{max-height:74vh}
    .prof-logo{width:82px;height:82px}
  }
  .notif{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--panel2);cursor:pointer}
  .notif.unread{border-color:var(--brand);background:rgba(108,92,231,.08)}
  .notif .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:5px;flex:0 0 auto}
  .notif.read .dot{background:transparent}
  .notif .nt{font-weight:700;font-size:13.5px}
  .notif .nb{color:var(--muted);font-size:13px;margin-top:2px}
  .notif .nm{color:var(--muted);font-size:11px;margin-top:4px}
  .profile-wrap{position:relative}
  .avatar-btn{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:50%;padding:3px;width:40px;height:40px;box-shadow:0 3px 10px rgba(0,0,0,.14);transition:transform .16s,box-shadow .2s}
  .avatar-btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.2)}
  .avatar-btn:active{transform:scale(.94)}
  .avatar-btn .who-name,.avatar-btn .caret{display:none}
  .avatar{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--brand);font-size:14px;background:#fff;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:50%}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .who-name{font-size:13px;color:var(--txt);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu{position:absolute;right:0;top:48px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;overflow:hidden}
  .theme-wrap{position:relative}
  .theme-menu{width:262px;padding:12px}
  .theme-menu .mh3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 9px}
  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .theme-opt{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--txt);cursor:pointer;font-size:12.5px;font-weight:600;text-align:left}
  .theme-opt:hover{border-color:var(--brand2)}
  .theme-opt.active{border-color:var(--brand2);box-shadow:0 0 0 2px var(--brand2) inset}
  .theme-dot{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
  .menu-head{padding:14px}
  .menu-item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt);padding:11px 14px;font-size:14px;border-top:1px solid var(--line)}
  .menu-item:hover{background:var(--panel2)}
  .menu-item.danger{color:#ffb4b4}
  @media(max-width:680px){.who-name{display:none}}
  .hero{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .hero .lg{width:60px;height:60px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:var(--panel2)}
  .hero .lg.ph{display:grid;place-items:center;font-weight:800;color:#fff;font-size:22px;

  /* ===== Advanced UI animations ===== */
  @keyframes cr-fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes cr-pop{0%{opacity:0;transform:scale(.92)}60%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
  @keyframes cr-overlay-in{from{opacity:0}to{opacity:1}}
  @keyframes cr-modal-in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes cr-grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes cr-shimmer{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
  @keyframes cr-pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,92,231,0)}50%{box-shadow:0 0 0 6px rgba(108,92,231,.12)}}
  /* entrance */
  .stat,.card,.rep-card,.rep-stat,.welcome{animation:cr-fade-up .5s cubic-bezier(.22,.61,.36,1) both}
  .stat:nth-child(2),.rep-stat:nth-child(2),.rep-card:nth-child(2){animation-delay:.06s}
  .stat:nth-child(3),.rep-stat:nth-child(3),.rep-card:nth-child(3){animation-delay:.12s}
  .stat:nth-child(4),.rep-stat:nth-child(4),.rep-card:nth-child(4){animation-delay:.18s}
  .stat:nth-child(5),.rep-stat:nth-child(5){animation-delay:.24s}
  tbody tr{animation:cr-fade-up .4s ease both}
  tbody tr:nth-child(2){animation-delay:.03s}
  tbody tr:nth-child(3){animation-delay:.06s}
  tbody tr:nth-child(4){animation-delay:.09s}
  tbody tr:nth-child(5){animation-delay:.12s}
  tbody tr:nth-child(n+6){animation-delay:.15s}
  /* hover lift */
  .stat,.card,.rep-card,.rep-stat,.att,.comment,.bcard{transition:transform .25s cubic-bezier(.22,.61,.36,1),box-shadow .25s,border-color .25s}
  .stat:hover,.card:hover,.rep-card:hover,.rep-stat:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.38);border-color:rgba(142,124,255,.45)}
  .att:hover,.comment:hover{transform:translateX(3px);border-color:rgba(142,124,255,.4)}
  .stat .ic,.rep-stat .ic{transition:transform .3s}
  .stat:hover .ic,.rep-stat:hover .ic{transform:scale(1.08) rotate(-4deg)}
  /* buttons */
  .btn{position:relative;overflow:hidden;background-size:180% 180%;transition:transform .18s,box-shadow .2s,background-position .4s,opacity .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(108,92,231,.35);background-position:100% 50%}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn::after{content:'';position:absolute;top:0;left:0;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-130%);pointer-events:none}
  .btn:hover::after{animation:cr-shimmer .85s ease}
  .link-btn{transition:color .2s,transform .2s}
  .link-btn:hover{transform:translateY(-1px)}
  /* tabs */
  .navtabs button{position:relative;transition:color .2s,background .25s,border-color .25s,transform .15s}
  .navtabs button:hover{transform:translateY(-1px);color:var(--txt)}
  .navtabs button.active{animation:cr-pop .35s ease both}
  /* welcome banner animated gradient */
  .welcome{background-size:200% 200%;animation:cr-fade-up .5s both,cr-grad 12s ease infinite}
  /* modal / overlay */
  .overlay{animation:cr-overlay-in .25s ease both}
  .modal{animation:cr-modal-in .34s cubic-bezier(.22,.61,.36,1) both}
  /* inputs */
  .inp{transition:border-color .2s,box-shadow .2s,background .2s}
  .inp:focus{box-shadow:0 0 0 3px rgba(108,92,231,.18)}
  /* notification badge */
  #bell-badge:not(.hidden){animation:cr-pulse 2s ease-in-out infinite}
  /* status badges */
  .badge{transition:transform .2s}
  .badge:hover{transform:scale(1.06)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* theme studio + extra controls */
  .theme-extra{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}

  .ldr-pix i:nth-child(1){left:18%;top:30%}.ldr-pix i:nth-child(2){left:78%;top:24%}.ldr-pix i:nth-child(3){left:26%;top:70%}
  .ldr-pix i:nth-child(4){left:70%;top:68%}.ldr-pix i:nth-child(5){left:50%;top:15%}.ldr-pix i:nth-child(6){left:60%;top:82%}
  @keyframes ldr-pop{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes ldr-slide{0%{left:-42%}100%{left:104%}}
  @keyframes ldr-pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.08);opacity:1}}

  .switch .sl:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.35)}

  .switch input:checked+.sl:before{transform:translateX(20px)}
  .chero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:22px 22px 24px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 16px 44px -12px var(--brand)}

  .chero::before{content:"";position:absolute;right:30px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}

  .chero-name{font-size:27px;font-weight:900;margin-top:3px;line-height:1.1;position:relative}

  .dm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

  .dm-card:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 16px 34px -12px var(--brand)}
  .dm-card:hover{transform:translateY(-3px);border-color:var(--brand)}

  .dm-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--chip);flex:0 0 auto}

  .ln-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:14px}

  .ln-rt-d{font-size:11.5px;color:var(--muted);margin-top:2px}

  /* ===== Mobile-first polish ===== */
  html{scroll-behavior:smooth}
  *{-webkit-tap-highlight-color:transparent}
  .table-wrap{-webkit-overflow-scrolling:touch}
  @media(max-width:640px){
    .wrap{padding-left:12px;padding-right:12px}
    .card{border-radius:18px;padding:14px}
    .hero,.ln-hero,.welcome{border-radius:18px;padding:14px 16px}
    .btn,.btn-sm,.link-btn,.navside,.theme-act{min-height:44px;display:inline-flex;align-items:center;justify-content:center}

    .fb-stars{font-size:34px}
    .side-collapse{display:none}
  }
  @media(hover:none){ .btn:active,.btn-sm:active,.navside:active,.dm-card:active,.fold-card:active{transform:scale(.98)} }
</style>

<body>

<canvas id="bg3d"></canvas>

<div id="app-loader" class="app-loader">
  <div class="ldr-glow"></div>

  <div class="ldr-inner">
    <div class="ldr-logo"><img src="assets/stepstones-logo.svg" alt="Stepstones"></div>

</div>

<div id="auth-view" class="auth-wrap">
  <div class="auth-card">
    <div class="logo logo-login">
      <div class="brand-logo brand-logo-lg" id="brand-wrap-1"><img id="brand-img-1" src="assets/stepstones-logo.svg" alt="Stepstones"></div>
    </div>

    <div id="form-login">
      <label>Username or Email</label>

      <label>Password</label>
      <div class="pw-wrap">
        <input id="li-pass" class="inp" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
        <button type="button" class="pw-eye" onclick="togglePw('li-pass',this)" aria-label="Show password">👁</button>
      </div>
      <button class="btn" id="li-btn" onclick="doLogin()">Log in</button>
      <button class="btn btn-ghost" id="li-passkey" onclick="loginWithPasskey()" style="width:100%;margin-top:10px">👆 Sign in with fingerprint / passkey</button>
      <button class="btn btn-ghost" onclick="openOtpLogin()" style="width:100%;margin-top:8px">✉️ Sign in with email OTP</button>
    </div>

    <div id="form-setup" class="hidden">
      <div class="setup-note">First-time setup — create the administrator account for this portal.</div>

        <input id="se-pass" class="inp" type="password" placeholder="••••••••" />

    <div id="auth-msg" class="msg"></div>

</div>

<div id="app-view" class="hidden">
  <header class="top">
    <div class="logo">
      <div class="brand-logo" id="brand-wrap-2"><img id="brand-img-2" src="assets/stepstones-logo.svg" alt="Stepstones"></div>
    </div>
    <div class="who">
      <div class="theme-wrap">
        <button class="bell" id="theme-btn" onclick="toggleThemeMenu(event)" title="Colour theme"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 2.4 2.4 0 0 0 2-3.7 2.4 2.4 0 0 1 2-3.8h1.2A3.8 3.8 0 0 0 21 9.8 9 9 0 0 0 12 3z"/><circle cx="8" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1.1" fill="currentColor" stroke="none"/></svg></button>

      </div>

function sanitizeHTML(html){
  const tmp=document.createElement('div'); tmp.innerHTML=String(html||"");
  function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(ch){
      if(ch.nodeType===1){
        const tag=ch.tagName;
        if(!RICH_TAGS[tag]){ while(ch.firstChild) node.insertBefore(ch.firstChild,ch); node.removeChild(ch); return; }
        Array.prototype.slice.call(ch.attributes).forEach(function(a){
          if(tag==='A'&&a.name.toLowerCase()==='href'){ if(/^\s*javascript:/i.test(a.value)) ch.removeAttribute('href'); }
          else ch.removeAttribute(a.name);
        });
        if(tag==='A'){ ch.setAttribute('target','_blank'); ch.setAttribute('rel','noopener noreferrer'); }
        walk(ch);
      } else if(ch.nodeType===8){ node.removeChild(ch); }
    });
  }
  walk(tmp); walk(tmp);
  return tmp.innerHTML;
}
function htmlToText(html){
  if(!looksHTML(html)) return String(html||"");
  const tmp=document.createElement('div'); tmp.innerHTML=sanitizeHTML(html);
  tmp.querySelectorAll('li').forEach(function(li){ li.insertAdjacentText('afterbegin','• '); });

  tmp.querySelectorAll('p,div,li,h3,blockquote').forEach(function(b){ b.insertAdjacentText('beforeend','\n'); });
  return (tmp.innerText||tmp.textContent||"").replace(/\n{3,}/g,'\n\n').trim();
}

let MEDIA_REC=null, AUDIO_CHUNKS=[], RECORDED={}, REC_TIMER=null;
function fmtSecs(s){ const m=Math.floor(s/60), ss=String(s%60).padStart(2,"0"); return m+":"+ss; }
async function toggleRecord(key,btnId,playerId){
  const btn=$(btnId);
  if(MEDIA_REC && MEDIA_REC.state==="recording"){ MEDIA_REC.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    AUDIO_CHUNKS=[]; MEDIA_REC=new MediaRecorder(stream);
    MEDIA_REC.ondataavailable=e=>{ if(e.data&&e.data.size) AUDIO_CHUNKS.push(e.data); };
    MEDIA_REC.onstop=()=>{
      if(REC_TIMER){clearInterval(REC_TIMER);REC_TIMER=null;}
      const tEl=$(btnId+"-time"); if(tEl) tEl.classList.add("hidden");
      const blob=new Blob(AUDIO_CHUNKS,{type:"audio/webm"}); RECORDED[key]=blob;
      const p=$(playerId); if(p){ p.src=URL.createObjectURL(blob); }
      const wrap=$(playerId+"-wrap"); if(wrap) wrap.classList.remove("hidden");
      const cl=$(playerId+"-clear"); if(cl) cl.classList.remove("hidden");
      stream.getTracks().forEach(t=>t.stop());
      if(btn){ btn.classList.remove("recording"); const lab=btn.querySelector(".vr-label"); if(lab) lab.textContent="Re-record"; }
    };
    MEDIA_REC.start();
    let secs=0; const tEl=$(btnId+"-time"); if(tEl){ tEl.textContent="0:00"; tEl.classList.remove("hidden"); }
    REC_TIMER=setInterval(()=>{ secs++; const t2=$(btnId+"-time"); if(t2) t2.textContent=fmtSecs(secs); },1000);
    if(btn){ btn.classList.add("recording"); const lab=btn.querySelector(".vr-label"); if(lab) lab.textContent="Stop recording"; }
  }catch(e){ toast("Microphone not available or permission denied.",true); }
}

function bioSupported(){ return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext); }
function passkeyHas(){ try{ return localStorage.getItem("cr_bio_has")==="1"; }catch(_){ return false; } }
async function registerPasskey(){
  if(!bioSupported()){ toast("This device/browser doesn't support passkeys.",true); return; }
  if(!window.SWA){ toast("Passkey library still loading \u2014 try again in a moment.",true); return; }
  try{
    const j1=await callFn("webauthn",{action:"reg-options"});
    const att=await window.SWA.startRegistration(j1.options);
    await callFn("webauthn",{action:"reg-verify",att:att,label:((navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||"Device")});
    try{ localStorage.setItem("cr_bio_has","1"); localStorage.setItem("cr_bio_user",(ME&&ME.email)||""); }catch(_){ }
    toast("Passkey registered \u2713 You can now sign in with your fingerprint.");
    openBioSetup();
  }catch(e){ toast("Could not register passkey: "+((e&&e.message)||e),true); }
}
async function disablePasskey(){
  try{ await callFn("webauthn",{action:"reg-del"}); }catch(e){ toast("Could not remove: "+((e&&e.message)||e),true); return; }
  try{ localStorage.removeItem("cr_bio_has"); localStorage.removeItem("cr_bio_user"); }catch(_){ }
  toast("Passkey removed from your account."); closeModal();
}
async function loginWithPasskey(){
  if(!bioSupported()){ authMsg("This device/browser doesn't support passkeys."); return; }
  if(!window.SWA){ authMsg("Passkey not ready \u2014 try again in a moment."); return; }
  const btn=$("li-passkey"); if(btn){btn.disabled=true;btn.textContent="Waiting for fingerprint\u2026";}
  try{
    const j1=await callFn("webauthn",{action:"auth-options"});
    const assertion=await window.SWA.startAuthentication(j1.options);
    const j2=await callFn("webauthn",{action:"auth-verify",challengeId:j1.challengeId,assertion:assertion});
    const {error}=await sb.auth.verifyOtp({token_hash:j2.token_hash,type:"magiclink"});
    if(error) throw error;
    location.reload();
  }catch(e){ authMsg("Passkey sign-in failed: "+((e&&e.message)||e)); if(btn){btn.disabled=false;btn.textContent="\ud83d\udc46 Sign in with fingerprint / passkey";} }
}
function openBioSetup(){

    on?`<div class="ba-note" style="border-color:#22c55e55">\u2705 A passkey is registered on this device. On the login screen tap <b>Sign in with fingerprint</b> \u2014 no password needed.</div><div class="row" style="margin-top:14px"><button class="btn btn-sm btn-ok" style="width:auto" onclick="registerPasskey()">\u2795 Add another device</button><button class="btn btn-sm btn-danger" style="width:auto" onclick="disablePasskey()">Remove passkeys</button></div>`:
    `<p style="line-height:1.55">Register a <b>passkey</b> to sign in with your device's <b>fingerprint / Face ID / Windows Hello</b> \u2014 no password. Verified securely on the server; your password still works as a backup.</p><div class="row" style="margin-top:14px"><button class="btn btn-sm btn-ok" style="width:auto" onclick="registerPasskey()">\ud83d\udc46 Register passkey on this device</button><button class="btn btn-sm btn-ghost" style="width:auto" onclick="closeModal()">Cancel</button></div>`)+

function otpMsg(m,t){ const e=$("otp-msg"); if(e){ e.textContent=m; e.className="msg show "+(t||"err"); } }
async function otpSend(){
  const em=(($("otp-email")&&$("otp-email").value)||OTP_EMAIL||"").trim().toLowerCase();
  if(!em||!/@/.test(em)){ otpMsg("Enter a valid email."); return; }
  OTP_EMAIL=em; const b=$("otp-send")||$("otp-verify"); const t0=b?b.textContent:""; if(b){b.disabled=true;b.textContent="Sending…";}
  try{ await callFn("loans-otp",{action:"request",email:em}); }
  catch(e){ if(b){b.disabled=false;b.textContent=t0||"Send code";} otpMsg((e&&e.message)||"Could not send the code."); return; }
  if(b){b.disabled=false;b.textContent=t0||"Send code";}
  const s1=$("otp-step1"), s2=$("otp-step2"); if(s1)s1.classList.add("hidden"); if(s2)s2.classList.remove("hidden");
  otpMsg("Code emailed to "+em+". Enter the 6-digit code.","ok");
  const ci=$("otp-code"); if(ci) setTimeout(function(){ci.focus();},100);

async function otpVerify(){
  const code=(($("otp-code")&&$("otp-code").value)||"").trim();
  if(!code){ otpMsg("Enter the code from your email."); return; }
  const b=$("otp-verify"); if(b){b.disabled=true;b.textContent="Verifying…";}
  try{
    const j=await callFn("loans-otp",{action:"verify",email:OTP_EMAIL,code:code});
    const {error}=await sb.auth.verifyOtp({token_hash:j.token_hash,type:"magiclink"});
    if(error) throw error;
    location.reload();
  }catch(e){ if(b){b.disabled=false;b.textContent="Verify & sign in";} otpMsg((e&&e.message)||"Invalid or expired code."); }
}

let RAISE_PASTES={f:[],ac:[]};
function crPaste(e,key){
  const items=(e.clipboardData&&e.clipboardData.items)||[]; let n=0;
  for(const it of items){ if(it.type&&it.type.indexOf("image")===0){ const f=it.getAsFile(); if(f){ const ext=(f.type.split("/")[1]||"png"); RAISE_PASTES[key].push(new File([f],`pasted-${Date.now()}-${RAISE_PASTES[key].length+1}.${ext}`,{type:f.type||"image/png"})); n++; } } }
  if(n){ e.preventDefault(); crRenderPaste(key); toast(n+" image"+(n>1?"s":"")+" pasted."); }
}
function crRenderPaste(key){
  const box=$(key+"-paste-prev"); if(!box)return; const arr=RAISE_PASTES[key]||[];
  if(arr.length){ box.classList.remove("hidden"); box.innerHTML=arr.map((f,i)=>{const u=URL.createObjectURL(f);return `<div class="paste-thumb"><img src="${u}" alt=""><button class="paste-x" title="Remove" onclick="crRemovePaste('${key}',${i})">×</button></div>`;}).join(""); }
  else { box.classList.add("hidden"); box.innerHTML=""; }
}
function crRemovePaste(key,i){ (RAISE_PASTES[key]||[]).splice(i,1); crRenderPaste(key); }

function dmFilteredRows(){

    if(DM_LF.assigned&&DM_LF.assigned!=="__none__"&&e.assigned_to!==DM_LF.assigned)return false;

async function loadAnalyticsInto(boxId,sites,enq){

let ATT_STARTED=false, ATT_TIMER=null, ATT_PING=null, _attLast=0; const ATT_IDLE_MS=15*60*1000;
async function startAttendance(){
  if(ATT_STARTED)return; ATT_STARTED=true;
  try{ await sb.rpc("cr_attendance_checkin"); }catch(_){ }
  ["mousemove","mousedown","keydown","touchstart","scroll","click"].forEach(function(ev){ window.addEventListener(ev,attActivity,{passive:true}); });
  attResetIdle();
  ATT_PING=setInterval(function(){ sb.rpc("cr_attendance_ping").catch(function(){}); },5*60*1000);
}
function attResetIdle(){ if(ATT_TIMER)clearTimeout(ATT_TIMER); ATT_TIMER=setTimeout(function(){ attendanceLogout("Auto logout — 15 min inactivity"); }, ATT_IDLE_MS); }
function attActivity(){ const n=Date.now(); if(n-_attLast<2000)return; _attLast=n; attResetIdle(); }
async function attendanceLogout(reason){
  try{ if(ATT_TIMER)clearTimeout(ATT_TIMER); if(ATT_PING)clearInterval(ATT_PING); }catch(_){ }
  try{ await sb.rpc("cr_attendance_checkout",{p_reason:reason||"Signed out"}); }catch(_){ }
  try{ toast(reason&&reason.indexOf("Auto")===0?"Logged out — 15 min inactivity.":"Logged out. See you soon!"); }catch(_){ }
  try{ await sb.auth.signOut(); }catch(_){ }
  setTimeout(function(){ location.reload(); },400);
}

async function loadAttendance(){
  const b=$("att-body"); if(!b)return;
  let q=sb.from("cr_attendance").select("*").gte("work_date",ATT_F.from).lte("work_date",ATT_F.to).order("work_date",{ascending:false});
  if(ATT_F.agent) q=q.eq("user_id",ATT_F.agent);
  const {data,error}=await q; if(error){ b.innerHTML=`<div class="hint">${esc(error.message)}</div>`; return; }
  const rows=data||[];
  if(ATT_F.agent){
    const map={}; rows.forEach(function(r){ map[r.work_date]=r; });
    const days=[]; let d=new Date(ATT_F.to), start=new Date(ATT_F.from);
    while(d>=start){ days.push(d.toISOString().slice(0,10)); d=new Date(d.getTime()-864e5); }
    let present=0;
    const trs=days.map(function(day){ const r=map[day]; const isP=!!(r&&r.login_at); if(isP)present++;
      const online=r&&r.login_at&&!r.logout_at;
      return `<tr><td style="white-space:nowrap">${esc(fmtDay(day))}</td><td>${isP?'<span class="badge" style="background:rgba(34,197,94,.15);color:#8ff0c8;border:1px solid rgba(34,197,94,.45)">Present</span>':'<span class="badge" style="background:rgba(255,91,107,.15);color:#ff9b9b;border:1px solid rgba(255,91,107,.45)">Absent</span>'}</td><td>${r&&r.login_at?esc(fmtTime(r.login_at)):"—"}</td><td>${r&&r.logout_at?esc(fmtTime(r.logout_at)):(online?'<span class="badge" style="background:rgba(34,197,94,.14);color:#8ff0c8;border:1px solid rgba(34,197,94,.4)">online</span>':"—")}</td><td>${attDur(r)}</td><td class="hint">${r&&r.logout_reason?esc(r.logout_reason):""}</td></tr>`;
    }).join("");
    b.innerHTML=`<div class="hint" style="margin-bottom:8px">Present <b>${present}</b> of ${days.length} day(s)</div><div class="table-wrap"><table class="lead-table"><thead><tr><th>Date</th><th>Status</th><th>Login</th><th>Logout</th><th>Duration</th><th>Note</th></tr></thead><tbody>${trs}</tbody></table></div>`;
  } else {
    b.innerHTML=`<div class="table-wrap"><table class="lead-table"><thead><tr><th>Date</th><th>Agent</th><th>Login</th><th>Logout</th><th>Duration</th></tr></thead><tbody>${rows.map(function(r){ const online=r.login_at&&!r.logout_at; return `<tr><td style="white-space:nowrap">${esc(fmtDay(r.work_date))}</td><td><b>${esc(r.user_name||"—")}</b></td><td>${r.login_at?esc(fmtTime(r.login_at)):"—"}</td><td>${r.logout_at?esc(fmtTime(r.logout_at)):(online?'<span class="badge" style="background:rgba(34,197,94,.14);color:#8ff0c8;border:1px solid rgba(34,197,94,.4)">online</span>':"—")}</td><td>${attDur(r)}</td></tr>`;}).join("")||'<tr><td colspan="5" class="hint">No attendance in this range.</td></tr>'}</tbody></table></div>`;
  }
}

function filteredLoans(){

    if(LOAN_F.call && l.call_status!==LOAN_F.call) return false;
    if(LOAN_F.stage && l.stage!==LOAN_F.stage) return false;
    if(LOAN_F.q){ const q=LOAN_F.q.toLowerCase(); if(((l.name||"")+(l.phone||"")).toLowerCase().indexOf(q)<0) return false; }
    if(LOAN_F.from && new Date(l.created_at) < new Date(LOAN_F.from)) return false;
    if(LOAN_F.to){ const t=new Date(LOAN_F.to); t.setHours(23,59,59); if(new Date(l.created_at) > t) return false; }
    return true;
  });
}

function parseCsvLine(line){ const out=[]; let cur="",q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(ch===','&&!q){ out.push(cur.trim()); cur=""; } else cur+=ch; } out.push(cur.trim()); return out; }

async function doLoanImport(){
  const raw=($("li-text").value||"").trim(); if(!raw){toast("Paste some rows or choose a file.",true);return;}
  const batch=($("li-batch").value||"").trim()||null;
  let lines=raw.split(/\r?\n/).filter(x=>x.trim());
  if(lines.length && /phone|mobile|number/i.test(lines[0]) && /name|city|source/i.test(lines[0])) lines=lines.slice(1);
  const rows=[]; const uid=(SESSION&&SESSION.user)?SESSION.user.id:null;
  for(const ln of lines){ const c=parseCsvLine(ln); let name=null,phone=null,city=null,source=null,note=null;
    if(c.length===1){ phone=c[0]; } else { name=c[0]||null; phone=c[1]||null; city=c[2]||null; source=c[3]||null; note=c[4]||null; }
    if(name && !/\d/.test(phone||"") && /\d/.test(name)){ const t=name; name=phone; phone=t; }
    phone=(phone||"").replace(/[^0-9+]/g,""); if(!phone) continue;
    rows.push({name,phone,city,source,note,batch,created_by:uid,call_status:"New",stage:"None"});
  }
  if(!rows.length){toast("No valid phone numbers found.",true);return;}
  const btn=$("li-btn"); if(btn){btn.disabled=true;btn.textContent="Importing…";}
  let done=0;
  for(let i=0;i<rows.length;i+=200){ const {error}=await sb.from("cr_loan_leads").insert(rows.slice(i,i+200)); if(error){toast(error.message,true); if(btn){btn.disabled=false;btn.textContent="Import";} return;} done+=Math.min(200,rows.length-i); }

}

async function saveLoanEdit(id){
  const cb=$("le-cb").value?new Date($("le-cb").value).toISOString():null;
  const amt=$("le-amt").value!==""?parseFloat($("le-amt").value):null;
  const disb=$("le-disb").value!==""?parseFloat($("le-disb").value):null;

  if($("le-name")){ const nm=($("le-name").value||"").trim(); if(nm){ const r=await sb.from("cr_loan_leads").update({name:nm}).eq("id",id); if(r&&r.error){ toast(r.error.message,true); } } }
  const {error}=await sb.rpc("cr_loan_update",{p_id:id,p_call_status:$("le-call").value,p_stage:$("le-stage").value,p_loan_amount:amt,p_disbursed:disb,p_callback:cb,p_remarks:($("le-rem").value||"").trim()||null,p_log_call:$("le-log").checked});

async function loadUnmaskAudit(){

  const rep=lnReportBuild(); if(!rep.rows.length){toast("No data to export.",true);return;}
  const name=lnReportTitle();
  if(fmt==="xlsx"){ const objs=rep.rows.map(r=>{ const o={}; rep.cols.forEach((c,i)=>o[c]=r[i]); return o; }); const ws=XLSX.utils.json_to_sheet(objs); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Report"); XLSX.writeFile(wb,name+".xlsx"); toast("Excel downloaded."); return; }
  if(fmt==="csv"){ const esc2=v=>{ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }; const csv=[rep.cols.join(",")].concat(rep.rows.map(r=>r.map(esc2).join(","))).join("\n"); const b=new Blob([csv],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name+".csv"; a.click(); toast("CSV downloaded."); return; }
  if(fmt==="pdf"){ const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4",orientation:LN_R.type==="leads"?"landscape":"portrait"}); doc.setFontSize(14); doc.text(name.replace(/_/g," "),14,16); doc.setFontSize(9); doc.setTextColor(120); doc.text("Generated "+new Date().toLocaleString(),14,22);
    doc.autoTable({ startY:27, head:[rep.cols], body:rep.rows.map(r=>r.map(c=>String(c==null?"":c))), theme:"striped", headStyles:{fillColor:[124,58,237]}, styles:{fontSize:7.5,cellPadding:1.6} });
    doc.save(name+".pdf"); toast("PDF downloaded."); return; }
}

function filteredAdmin(){
  const term=($("a-search").value||"").trim().toLowerCase();
  const st=$("a-status").value,pr=$("a-priority").value,cl=$("a-client").value;
  const scope=$("a-scope")?$("a-scope").value:"all";
  const asg=$("a-assignee")?$("a-assignee").value:"";
  const tag=($("a-tag")?$("a-tag").value:"").trim().toLowerCase();
  const from=$("a-from")?$("a-from").value:"", to=$("a-to")?$("a-to").value:"";
  const fromT=from?new Date(from+"T00:00:00").getTime():null;
  const toT=to?new Date(to+"T23:59:59").getTime():null;
  return CACHE.filter(r=>{
    if(ADMIN_QUICK==="deleted"){ if(!r.deleted_at) return false; } else if(r.deleted_at) return false;
    if(ADMIN_QUICK==="pending" && (r.status==="Done"||r.status==="Rejected")) return false;
    if(ADMIN_QUICK==="completed" && r.status!=="Done") return false;
    if(ADMIN_QUICK==="overdue" && !(r.due_date && r.status!=="Done" && r.status!=="Rejected" && new Date(r.due_date)<new Date())) return false;
    if(st&&r.status!==st) return false;
    if(pr&&r.priority!==pr) return false;
    if(cl&&r.client_name!==cl) return false;
    if(asg){ if(asg==="__unassigned__"){ if(r.assigned_to) return false; } else if(r.assigned_to!==asg) return false; }
    if(tag&&!((r.tags||[]).join(" ").toLowerCase().includes(tag))) return false;
    if(fromT||toT){ const t=new Date(r.created_at).getTime(); if(fromT&&t<fromT) return false; if(toT&&t>toT) return false; }
    if(term){
      const content=CONTENT_BY_REQ[r.id]||"";
      let hay;
      if(scope==="heading") hay=(r.title||"").toLowerCase();
      else if(scope==="desc") hay=htmlToText(r.description).toLowerCase();
      else if(scope==="comments") hay=content;
      else if(scope==="tags") hay=(r.tags||[]).join(" ").toLowerCase();
      else if(scope==="ref") hay=(r.ref_no||"").toLowerCase();
      else hay=crText(r)+" "+content;
      if(!hay.includes(term)) return false;
    }
    return true;
  });
}
function crStamp(r){
  let cls="pending",lbl="Pending";

  else if(r.status==="Rejected"){cls="rejected";lbl="Rejected";}
  else if(r.needs_clarification){cls="clarify";lbl="Need Clarification";}
  return `<div class="stamp ${cls}">${lbl}</div>`;
}

let LEADS=[], LEAD_VIEW="pipeline", LEAD_DRAG=null;

const LEAD_SOURCES=["Referral","Website","Cold call","Social","Event","Other"];
function money(v){ if(v==null||v==="") return "—"; const n=Number(v); if(isNaN(n)) return "—"; return "₹"+n.toLocaleString("en-IN"); }
function toLocalDT(iso){ const d=new Date(iso); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
function leadFollowState(l){ if(!l.follow_up_at) return ""; const t=new Date(l.follow_up_at).getTime(), now=Date.now(); if(t<now-60000) return "overdue"; if(t<now+24*3600000) return "soon"; return ""; }
async function loadLeads(){ const {data,error}=await sb.from("cr_leads").select("*").order("updated_at",{ascending:false}); if(error){toast(error.message,true);return [];} LEADS=data||[]; return LEADS; }
async function renderAdminLeads(){ $("admin-pane").innerHTML=`<div id="leads-pane"><div class="hint">Loading…</div></div>`; await loadAdmins(); await loadLeads(); drawLeads(); }
function leadStats(){ const open=LEADS.filter(l=>l.stage!=="Won"&&l.stage!=="Lost"); const won=LEADS.filter(l=>l.stage==="Won"); return {total:LEADS.length, open:open.length, won:won.length, pipeVal:open.reduce((s,l)=>s+(Number(l.value)||0),0), wonVal:won.reduce((s,l)=>s+(Number(l.value)||0),0)}; }
function drawLeads(){

      ${statCard("🔥","#00b8d4",st.open,"Open")}
      ${statCard("🏆","#22c55e",st.won,"Won")}
      ${statCard("💰","#ffb020",money(st.pipeVal),"Open pipeline")}

function setLeadView(v){ LEAD_VIEW=v; if($("leads-pane")) drawLeads(); }
function filteredLeads(){
  const term=($("lead-search")?$("lead-search").value:"").trim().toLowerCase();
  const owner=$("lead-owner")?$("lead-owner").value:"";
  return LEADS.filter(l=>{ if(owner&&l.owner_id!==owner) return false; if(term){ const hay=[l.name,l.company,l.email,l.phone,l.source,l.notes].filter(Boolean).join(" ").toLowerCase(); if(!hay.includes(term)) return false; } return true; });

function drawLeadBody(){ if(LEAD_VIEW==="pipeline") buildLeadBoard(); else renderLeadList(); }
function leadCard(l){ const fs=leadFollowState(l); return `<div class="bcard" draggable="true" ondragstart="dragLead(event,'${l.id}')" onclick="openLeadDetail('${l.id}')">

    <div class="bc-meta">${l.value?("💰 "+money(l.value)):""}${l.owner_name?` · 👤 ${esc(l.owner_name)}`:""}</div>
    ${l.follow_up_at?`<div class="bc-meta lead-fu ${fs}">⏰ ${esc(fmtDay(l.follow_up_at))}</div>`:""}
  </div>`; }
function buildLeadBoard(){
  const body=$("lead-body"); if(!body)return; const list=filteredLeads();
  body.innerHTML=`<div class="board">`+LEAD_STAGES.map(stg=>{
    const items=list.filter(l=>l.stage===stg); const val=items.reduce((s,l)=>s+(Number(l.value)||0),0);
    return `<div class="bcol" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropLead(event,'${stg}')">
      <div class="bcol-h"><span class="badge" style="background:${LEAD_SC[stg]}26;color:${LEAD_SC[stg]};border:1px solid ${LEAD_SC[stg]}66">${stg}</span><span style="color:var(--muted)">${items.length}${val?" · "+money(val):""}</span></div>
      <div>${items.map(l=>leadCard(l)).join("")||`<div class="hint" style="padding:6px">—</div>`}</div>
    </div>`;
  }).join("")+`</div>`;
}

async function dropLead(e,stage){
  e.preventDefault(); e.currentTarget.classList.remove("over");
  const id=LEAD_DRAG; LEAD_DRAG=null; if(!id)return;
  const l=LEADS.find(x=>x.id===id); if(!l||l.stage===stage)return; const old=l.stage;
  const {error}=await sb.from("cr_leads").update({stage,updated_at:new Date().toISOString()}).eq("id",id);
  if(error){toast(error.message,true);return;}
  l.stage=stage; l.updated_at=new Date().toISOString();
  sb.from("cr_lead_activities").insert({lead_id:id,kind:"stage",body:`Stage: ${old} → ${stage}`,created_by:SESSION.user.id,created_by_name:ME.full_name||"Admin"});
  toast(`${l.name} → ${stage}`); buildLeadBoard();
}

async function saveLead(id){
  const name=($("ld-name").value||"").trim(); if(!name){toast("Name is required.",true);return;}
  const ownerId=$("ld-owner").value||null; const a=ADMINS.find(x=>x.id===ownerId); const ownerName=a?(a.full_name||a.username||a.email):null;
  const fu=$("ld-follow").value;
  const payload={ name, company:$("ld-company").value.trim()||null, email:$("ld-email").value.trim()||null, phone:$("ld-phone").value.trim()||null, source:$("ld-source").value||null, stage:$("ld-stage").value, value:$("ld-value").value!==""?Number($("ld-value").value):null, expected_close:$("ld-close").value||null, owner_id:ownerId, owner_name:ownerName, follow_up_at:fu?new Date(fu).toISOString():null, notes:$("ld-notes").value.trim()||null, updated_at:new Date().toISOString() };
  const btn=$("ld-save"); if(btn){btn.disabled=true;btn.textContent="Saving…";}
  let error;
  if(id){ ({error}=await sb.from("cr_leads").update(payload).eq("id",id)); }
  else { payload.created_by=SESSION.user.id; payload.created_by_name=ME.full_name||"Admin"; ({error}=await sb.from("cr_leads").insert(payload)); }
  if(btn){btn.disabled=false;}
  if(error){toast(error.message,true);return;}
  toast(id?"Lead updated.":"Lead created."); closeModal(); await loadLeads(); drawLeads();
}

// ===================== GANTT (CR timeline) =====================
let GANTT_ZOOM=9;
async function renderAdminGantt(){
  $("admin-pane").innerHTML=`<div id="gantt-pane"><div class="hint">Loading…</div></div>`;
  await loadRequests(); await loadClients(); await loadCompletedTimes();
  drawGantt();
}
function drawGantt(){
  const clients=[...new Set(CACHE.map(r=>r.client_name).filter(Boolean))].sort();
  $("gantt-pane").innerHTML=`
    <div class="lead-bar">
      <h2 style="margin:0">CR Timeline (Gantt)</h2>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin:0">
        <div class="seg" id="gt-zoom"><button data-z="26" onclick="gZoom(26)">Day</button><button data-z="9" class="on" onclick="gZoom(9)">Week</button><button data-z="3" onclick="gZoom(3)">Month</button></div>
        <select id="gt-client" class="inp" onchange="buildGantt()" style="max-width:200px"><option value="">All clients</option>${clients.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
        <select id="gt-status" class="inp" onchange="buildGantt()"><option value="">All statuses</option>${STATUSES.map(x=>`<option>${x}</option>`).join("")}</select>
      </div>
    </div>
    <div class="gt-legend">${STATUSES.map(x=>`<span><i style="background:${REP_SC[x]||'#8e7cff'}"></i>${esc(x)}</span>`).join("")}<span><i class="mile"></i>Due date</span></div>
    <div id="gt-body-wrap"></div>`;
  buildGantt();
}
function gZoom(z){ GANTT_ZOOM=z; document.querySelectorAll('#gt-zoom button').forEach(b=>b.classList.toggle('on',+b.dataset.z===z)); buildGantt(); }
function buildGantt(){
  const wrap=$("gt-body-wrap"); if(!wrap) return;
  const cf=$("gt-client")?$("gt-client").value:"", sf=$("gt-status")?$("gt-status").value:"";
  let rows=CACHE.filter(r=>(!cf||r.client_name===cf)&&(!sf||r.status===sf)).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  if(!rows.length){ wrap.innerHTML=`<div class="empty">No change requests match.</div>`; return; }
  const DAY=86400000;
  const endOf=r=>{ if(r.status==="Done") return new Date(COMPLETED_AT[r.id]||r.updated_at).getTime(); const due=r.due_date?new Date(r.due_date).getTime():0; return Math.max(Date.now(),due); };
  const minS=Math.min(...rows.map(r=>new Date(r.created_at).getTime()));
  const maxE=Math.max(Date.now(),...rows.map(endOf));
  const p=new Date(minS-3*DAY); p.setHours(0,0,0,0);
  const start=p.getTime(), end=maxE+6*DAY, dayW=GANTT_ZOOM, labelW=240;
  const totalDays=Math.ceil((end-start)/DAY), tlW=totalDays*dayW;
  const xOf=t=>((t-start)/DAY)*dayW;
  let ticks=""; let d=new Date(start); d.setDate(1);
  while(d.getTime()<end){ ticks+=`<div class="gt-tick month" style="left:${xOf(d.getTime())}px"><span>${d.toLocaleDateString(undefined,{month:"short",year:"2-digit"})}</span></div>`; d.setMonth(d.getMonth()+1); }
  if(dayW>=9){ let w=new Date(start); w.setHours(0,0,0,0); w.setDate(w.getDate()-((w.getDay()+6)%7)); while(w.getTime()<end){ ticks+=`<div class="gt-tick" style="left:${xOf(w.getTime())}px"></div>`; w.setDate(w.getDate()+7); } }
  const todayX=xOf(Date.now());
  const body=rows.map(r=>{
    const st=new Date(r.created_at).getTime(), en=endOf(r), left=xOf(st), w=Math.max(8,xOf(en)-left);
    const col=REP_SC[r.status]||"#8e7cff";
    const due=r.due_date?new Date(r.due_date).getTime():0;
    const overdue=due&&r.status!=="Done"&&due<Date.now();
    const dur=Math.max(1,Math.round((en-st)/DAY));
    const tip=`${r.ref_no} · ${r.status} · raised ${fmtDay(r.created_at)}${r.status==="Done"?" · done "+fmtDay(en):(due?" · due "+fmtDay(r.due_date):"")} · ${dur}d`;
    const mile=due?`<div class="gt-mile" style="left:${xOf(due)}px;border-color:${overdue?'#ff6b6b':'#ffb020'}" title="Due ${esc(fmtDay(r.due_date))}"></div>`:"";
    return `<div class="gt-row"><div class="gt-label"><span class="ref">${esc(r.ref_no)}</span><span class="t" title="${esc(r.title)}">${esc(r.title)}</span></div>
      <div class="gt-lane" style="width:${tlW}px"><div class="gt-bar" style="left:${left}px;width:${w}px;background:${col}" title="${esc(tip)}" onclick="openDetail('${r.id}')">${w>58?esc(r.ref_no):""}</div>${mile}</div></div>`;
  }).join("");
  const lines=ticks.replace(/<span[^>]*>.*?<\/span>/g,"");
  wrap.innerHTML=`<div class="gt-wrap"><div class="gt-scroll"><div class="gt-grid" style="width:${labelW+tlW}px">
    <div class="gt-head"><div class="gt-label" style="justify-content:center"><b>Change request</b></div><div class="gt-ticks" style="width:${tlW}px">${ticks}</div></div>
    <div class="gt-body"><div class="gt-lines" style="position:absolute;left:${labelW}px;top:0;bottom:0;right:0;pointer-events:none">${lines}<div class="gt-today" style="left:${todayX}px"><span>Today</span></div></div>${body}</div>
  </div></div></div>`;
}


// ===================== ADMIN DASHBOARD (overview) =====================
let HM_CHARTS={}, CLOCK_TIMER=null, CAL_VIEW=null;
function calKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function calNav(dl){ const b=CAL_VIEW||new Date(); CAL_VIEW=new Date(b.getFullYear(),b.getMonth()+dl,1); renderCalendar(); }
function buildCalEvents(){ const m={};
  (CACHE||[]).forEach(r=>{ if(r.due_date){ const k=String(r.due_date).slice(0,10); (m[k]=m[k]||{cr:0,lead:0}).cr++; } });
  (LEADS||[]).forEach(l=>{ if(l.follow_up_at){ const k=calKey(new Date(l.follow_up_at)); (m[k]=m[k]||{cr:0,lead:0}).lead++; } });
  return m; }
function renderCalendar(){
  const el=$("cal-grid"); if(!el)return; const base=CAL_VIEW||new Date(); const y=base.getFullYear(), mo=base.getMonth();
  const tt=$("cal-title"); if(tt) tt.textContent=base.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const startDow=(new Date(y,mo,1).getDay()+6)%7, days=new Date(y,mo+1,0).getDate();
  const ev=buildCalEvents(), todayKey=calKey(new Date());
  let c=["M","T","W","T","F","S","S"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<startDow;i++) c+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){ const k=calKey(new Date(y,mo,d)); const e=ev[k]; const tip=e?((e.cr?e.cr+" CR due ":"")+(e.lead?e.lead+" follow-up":"")):"";
    c+=`<div class="cal-cell${k===todayKey?' today':''}" title="${esc(tip)}">${d}${e?`<span class="cal-dot${e.cr?' cr':''}${e.lead?' lead':''}"></span>`:""}</div>`; }
  el.innerHTML=c;
}
function renderAgenda(){
  const el=$("cal-agenda"); if(!el)return; const now=Date.now(), wk=now+7*864e5; const items=[];
  (CACHE||[]).forEach(r=>{ if(r.due_date&&r.status!=="Done"&&r.status!=="Rejected"){ const t=new Date(r.due_date).getTime(); if(t<=wk) items.push({t,type:"CR",label:r.ref_no+" · "+r.title,id:r.id,over:t<now}); } });
  (LEADS||[]).forEach(l=>{ if(l.follow_up_at&&l.stage!=="Won"&&l.stage!=="Lost"){ const t=new Date(l.follow_up_at).getTime(); if(t<=wk) items.push({t,type:"Lead",label:l.name,over:t<now}); } });
  items.sort((a,b)=>a.t-b.t);

}
function startClock(){ if(CLOCK_TIMER)clearInterval(CLOCK_TIMER); updateClock(); CLOCK_TIMER=setInterval(updateClock,1000); }
function updateClock(){
  const real=$("lc-real"); if(!real && !$("cl-ss")){ if(CLOCK_TIMER){clearInterval(CLOCK_TIMER);CLOCK_TIMER=null;} return; }
  const d=new Date(); let hh=d.getHours(); const ap=hh>=12?"PM":"AM"; hh=hh%12||12; const p=n=>String(n).padStart(2,"0");
  if(real) real.textContent=p(hh)+":"+p(d.getMinutes());
  const ss=$("lc-ss"); if(ss) ss.textContent=p(d.getSeconds());
  const apEl=$("lc-ap"); if(apEl) apEl.textContent=ap;
  const dt=$("lc-date"); if(dt) dt.textContent=p(d.getDate())+"."+p(d.getMonth()+1);
  const days=$("lc-days"); if(days){ const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]; days.querySelectorAll("span").forEach(x=>x.classList.toggle("on",x.dataset.d===wd)); }
  const s=d.getSeconds(), mi=d.getMinutes(), h12=d.getHours()%12;
  const setH=(id,deg)=>{const e=$(id); if(e) e.setAttribute("transform","rotate("+deg+" 50 50)");};
  setH("cl-ss", s*6); setH("cl-mm", mi*6+s*0.1); setH("cl-hh", h12*30+mi*0.5);
}

function xhrUpload(bucket,path,file,onProg){
  return new Promise(function(resolve,reject){
    sb.auth.getSession().then(function(res){
      const session=res&&res.data?res.data.session:null;
      const token=session?session.access_token:SUPABASE_KEY;
      const xhr=new XMLHttpRequest();
      const enc=path.split("/").map(encodeURIComponent).join("/");
      xhr.open("POST", SUPABASE_URL+"/storage/v1/object/"+bucket+"/"+enc, true);
      xhr.setRequestHeader("Authorization","Bearer "+token);
      xhr.setRequestHeader("apikey",SUPABASE_KEY);
      xhr.setRequestHeader("x-upsert","false");
      xhr.upload.onprogress=function(e){ if(e.lengthComputable&&onProg) onProg(Math.round(e.loaded/e.total*100)); };
      xhr.onload=function(){ if(xhr.status>=200&&xhr.status<300){ if(onProg)onProg(100); resolve(true); } else { let m=""; try{ const j=JSON.parse(xhr.responseText); m=j.message||j.error||""; }catch(_){ m=xhr.responseText||""; } reject(new Error(m||("Upload failed ("+xhr.status+")"))); } };
      xhr.onerror=function(){ reject(new Error("Network error during upload")); };
      const fd=new FormData();
      fd.append("cacheControl","3600");
      fd.append("", file, file.name||"file");
      xhr.send(fd);
    }).catch(reject);
  });
}

async function saveUploads(pid,fid){
  const note=(($("fu-note")&&$("fu-note").value)||"").trim();
  const fs=[...(MOD_PASTES||[])];
  if($("fu-files")&&$("fu-files").files){ for(const f of $("fu-files").files) fs.push(f); }
  if(RECORDED["mod"]) fs.push(new File([RECORDED["mod"]],"voice-note-"+Date.now()+".webm",{type:"audio/webm"}));
  if(!fs.length && !note){ toast("Nothing to upload.",true); return; }
  if(!fs.length && note){
    const {error}=await sb.from("cr_module_items").insert({folder_id:fid,kind:"note",description:note,created_by:(SESSION&&SESSION.user)?SESSION.user.id:null,created_by_name:(ME&&(ME.full_name||ME.username||ME.email))||null});
    if(error){toast(error.message,true);return;}
    CUR_FOLDER=fid; toast("Note added."); openProject(pid); return;
  }
  const total=fs.length;
  openUploadProgress(total);
  let ok=0, bytes=0;
  for(let i=0;i<total;i++){
    const f=fs[i];
    setUploadProgress(i+1,total,f.name||"file",0,f.size);
    try{
      await uploadFolderItem(fid,f,(f.name||"").indexOf("voice-note-")===0?"voice":null,note,function(p){ setUploadProgress(i+1,total,f.name||"file",p,f.size); });
      ok++; bytes+=(f.size||0);
    }catch(e){
      closeModal(); toast("Upload failed: "+((e&&e.message)||e),true);
      MOD_PASTES=[]; CUR_FOLDER=fid; openProject(pid); return;
    }
  }
  delete RECORDED["mod"]; MOD_PASTES=[]; CUR_FOLDER=fid;
  uploadSuccess(ok+" file"+(ok===1?"":"s")+" uploaded", fmtBytes(bytes)+" added to this folder");
  const b=$("succ-btn"); if(b) b.onclick=function(){ openProject(pid); };
  setTimeout(function(){ if($("succ-btn")) openProject(pid); },1800);
}

async function bulkUploadPages(inp,pid){

function repData(){ if(!REP_RANGE) return CACHE.slice(); const cut=Date.now()-REP_RANGE*86400000; return CACHE.filter(r=>new Date(r.created_at).getTime()>=cut); }
function repStat(icon,color,num,label){ return `<div class="rep-stat"><div class="ic" style="background:${color}1f;color:${color}">${icon}</div><div><div class="n" style="color:${color}">${num}</div><div class="l">${esc(label)}</div></div></div>`; }
function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function buildReports(){
  const data=repData();
  const done=data.filter(r=>r.status==="Done");
  const avgDays=done.length?(done.reduce((s,r)=>s+(new Date(r.updated_at)-new Date(r.created_at)),0)/done.length/86400000):0;
  const compRate=data.length?Math.round(done.length/data.length*100):0;
  const open=data.filter(r=>r.status!=="Done"&&r.status!=="Rejected").length;
  const last7=data.filter(r=>new Date(r.created_at).getTime()>=Date.now()-7*86400000).length;
  if($("rep-stats")) $("rep-stats").innerHTML=
    repStat("📋","#8e7cff",data.length,"Total CRs")+
    repStat("🆕","#00b8d4",last7,"New (7 days)")+
    repStat("🕒","#ffb020",open,"Open")+
    repStat("✅","#22c55e",done.length,"Completed")+
    repStat("📈","#00d2a8",compRate+"%","Completion rate")+
    repStat("⏱️","#6c5ce7",avgDays?avgDays.toFixed(1):"—","Avg days to close");
  const by=(arr,key)=>{const m={};arr.forEach(r=>{const k=r[key]||"—";m[k]=(m[k]||0)+1});return m;};
  const cl=by(data,"client_name");
  const top=Object.entries(cl).sort((a,b)=>b[1]-a[1]).slice(0,8); const topNames=top.map(e=>e[0]);
  // ----- Client performance table (renders independently of charts) -----
  try{
    const names=Object.keys(cl).sort((a,b)=>cl[b]-cl[a]); const maxTot=Math.max(1,...names.map(n=>cl[n]));
    const rows=names.map(n=>{
      const rr=data.filter(r=>r.client_name===n); const tot=rr.length;
      const dn=rr.filter(r=>r.status==="Done"); const op=rr.filter(r=>r.status!=="Done"&&r.status!=="Rejected").length;
      const ip=rr.filter(r=>r.status==="In Progress").length;
      const cr=tot?Math.round(dn.length/tot*100):0;
      const ad=dn.length?(dn.reduce((s,r)=>s+(new Date(r.updated_at)-new Date(r.created_at)),0)/dn.length/86400000):null;
      const la=rr.reduce((m,r)=>Math.max(m,new Date(r.updated_at).getTime()),0);
      return `<tr><td><b>${esc(n)}</b><div class="an-bar"><span style="width:${Math.round(tot/maxTot*100)}%"></span></div></td>
        <td class="num">${tot}</td><td class="num">${op}</td><td class="num">${ip}</td><td class="num">${dn.length}</td>
        <td class="num" style="color:${cr>=70?'#22c55e':cr>=40?'#ffb020':'#ff6b6b'};font-weight:700">${cr}%</td>
        <td class="num">${ad==null?'—':ad.toFixed(1)}</td><td>${la?fmtDay(new Date(la)):'—'}</td></tr>`;
    }).join("");
    if($("an-table")) $("an-table").innerHTML=`<table class="an-table"><thead><tr><th>Client</th><th class="num">Total</th><th class="num">Open</th><th class="num">In&nbsp;Prog</th><th class="num">Done</th><th class="num">Compl.</th><th class="num">Avg&nbsp;days</th><th>Last activity</th></tr></thead><tbody>${rows||'<tr><td colspan="8" style="color:var(--muted)">No data in range.</td></tr>'}</tbody></table>`;

    for(let n=days-1;n>=0;n--){ const d=new Date(today.getTime()-n*86400000); const k=dkey(d); dlabels.push(d.toLocaleDateString(undefined,{month:"short",day:"numeric"})); dcounts.push(dmap[k]||0); }
    mk("daily",{type:"bar",data:{labels:dlabels,datasets:[{label:"Raised",data:dcounts,backgroundColor:"#8e7cff",borderRadius:5,maxBarThickness:22}]},options:Object.assign({},noLeg,{scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12}}}})});

    const dsets=sstatuses.map(stt=>({label:stt,data:topNames.map(n=>data.filter(r=>r.client_name===n&&r.status===stt).length),backgroundColor:REP_SC[stt]}));

    const resol=topNames.map(n=>{const dd=data.filter(r=>r.client_name===n&&r.status==="Done");return dd.length?(dd.reduce((s,r)=>s+(new Date(r.updated_at)-new Date(r.created_at)),0)/dd.length/86400000):0;});

    const mo={}; data.forEach(r=>{const d=new Date(r.created_at);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");mo[k]=(mo[k]||0)+1;});
    const mkeys=Object.keys(mo).sort(); let run=0; const cum=mkeys.map(k=>run+=mo[k]);

    const withDue=doneAll.filter(r=>r.due_date);
    const onTime=withDue.filter(r=>new Date(COMPLETED_AT[r.id]||r.updated_at)<=new Date(r.due_date+"T23:59:59")).length;
    mk("sla",{type:"doughnut",data:{labels:["On time","Late"],datasets:[{data:[onTime,withDue.length-onTime],backgroundColor:["#22c55e","#ff6b6b"],borderWidth:0}]},options:{cutout:"62%",plugins:{legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10,padding:10}}}}});
    const ty=by(data,"type");
    mk("type",{type:"doughnut",data:{labels:Object.keys(ty),datasets:[{data:Object.values(ty),backgroundColor:["#8e7cff","#00d2a8","#ffb020","#ff6b6b","#3b82f6","#a855f7"],borderWidth:0}]},options:{cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10,padding:10}}}}});
    const lst=(typeof LEADS!=="undefined"?LEADS:[])||[];
    const fL=(typeof LEAD_STAGES!=="undefined"?LEAD_STAGES:["New","Contacted","Qualified","Proposal","Negotiation","Won","Lost"]);
    mk("funnel",{type:"bar",data:{labels:fL,datasets:[{data:fL.map(stg=>lst.filter(l=>l.stage===stg).length),backgroundColor:fL.map(x=>(typeof LEAD_SC!=="undefined"&&LEAD_SC[x])||"#8e7cff"),borderRadius:6,maxBarThickness:26}]},options:Object.assign({},noLeg,{indexAxis:"y",scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}})});
    // insights
    const iel=$("an-insights"); if(iel){
      const bl=[]; const compRate2=data.length?Math.round(doneAll.length/data.length*100):0;
      const avgRes=doneAll.length?(doneAll.reduce((sx,r)=>sx+(new Date(COMPLETED_AT[r.id]||r.updated_at)-new Date(r.created_at)),0)/doneAll.length/DAY):0;
      const last4=created.slice(-4).reduce((a,b)=>a+b,0), prev4=created.slice(-8,-4).reduce((a,b)=>a+b,0);
      const trend=prev4?Math.round((last4-prev4)/prev4*100):null;
      const dowArr=[0,0,0,0,0,0,0]; data.forEach(r=>dowArr[new Date(r.created_at).getDay()]++); const busiest=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dowArr.indexOf(Math.max(...dowArr))];
      const overdue=openCRs.filter(r=>r.due_date&&new Date(r.due_date)<new Date()).length;
      const oldest=openCRs.length?Math.round(Math.max(...openCRs.map(r=>(now-new Date(r.created_at))/DAY))):0;
      bl.push(`✅ <b>${compRate2}%</b> completion rate · avg resolution <b>${avgRes?avgRes.toFixed(1):"—"}</b> days`);
      if(trend!==null) bl.push(`${trend>=0?"📈":"📉"} New CRs ${trend>=0?"up":"down"} <b>${Math.abs(trend)}%</b> vs previous 4 weeks`);
      bl.push(`🔥 Busiest request day: <b>${busiest}</b>`);
      if(topNames&&topNames[0]) bl.push(`🏆 Most active client: <b>${esc(topNames[0])}</b>`);
      bl.push(`🕒 <b>${openCRs.length}</b> open · <b>${overdue}</b> overdue · oldest open <b>${oldest}</b>d`);
      if(withDue.length) bl.push(`🎯 SLA: <b>${Math.round(onTime/withDue.length*100)}%</b> of due CRs completed on time`);
      if(lst.length){ const won=lst.filter(l=>l.stage==="Won").length, lostn=lst.filter(l=>l.stage==="Lost").length; const wr=(won+lostn)?Math.round(won/(won+lostn)*100):null; bl.push(`💼 Leads: <b>${lst.length}</b> total · win rate <b>${wr==null?"—":wr+"%"}</b>`); }
      iel.innerHTML=bl.map(x=>`<div class="ins">${x}</div>`).join("");
    }
  });
}

async function exportCRPdf(id){
  const r=CACHE.find(x=>x.id===id); if(!r)return;
  const {data:hist}=await sb.from("cr_status_history").select("*").eq("request_id",id).order("created_at");
  let commits=[]; try{ const ck=await sb.from("cr_commits").select("*").eq("request_id",id).order("created_at"); commits=ck.data||[]; }catch(_){}
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, M=14;
  const fmtFull=d=>d?new Date(d).toLocaleString("en-GB",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
  const PC={Low:[100,116,139],Medium:[245,176,32],High:[234,88,12],Critical:[239,68,68]};
  const SC={New:[154,160,189],"In Review":[255,176,32],Approved:[142,124,255],"In Progress":[0,210,168],Done:[34,197,94],Rejected:[255,107,107]};
  let completed=null; (hist||[]).forEach(h=>{ if(h.new_status==="Done") completed=h.created_at; }); if(!completed&&r.status==="Done") completed=r.updated_at;
  // header band
  doc.setFillColor(108,92,231); doc.rect(0,0,W,26,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Stepstones Global India",M,12);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text("Change Request Report",M,19.5);
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text(String(r.ref_no||""),W-M,11,{align:"right"});
  const sc=SC[r.status]||[120,120,120]; const stTxt=String(r.status||"").toUpperCase();
  doc.setFontSize(9); const stW=doc.getTextWidth(stTxt)+8; doc.setFillColor(sc[0],sc[1],sc[2]); doc.roundedRect(W-M-stW,15,stW,6.5,2,2,"F");
  doc.setTextColor(255,255,255); doc.text(stTxt,W-M-stW/2,19.4,{align:"center"});
  // title with accent bar
  let y=37;
  doc.setFillColor(196,154,74); doc.rect(M,y-5,3.5,9,"F");
  doc.setTextColor(25,25,30); doc.setFont("helvetica","bold"); doc.setFontSize(16);
  const titleLines=doc.splitTextToSize(String(r.title||""),W-2*M-8); doc.text(titleLines,M+7,y+1.5); y+=titleLines.length*7+3;
  // Area / Type / Priority strip
  doc.autoTable({ startY:y, theme:"grid", styles:{fontSize:10,cellPadding:2.6,lineColor:[225,225,232]},
    body:[[{content:"Area",styles:{fontStyle:"bold",textColor:[120,120,128],cellWidth:18}}, r.area||"—",
           {content:"Type",styles:{fontStyle:"bold",textColor:[120,120,128],cellWidth:18}}, r.type||"—",
           {content:"Priority",styles:{fontStyle:"bold",textColor:[120,120,128],cellWidth:20}}, {content:r.priority||"—",styles:{textColor:PC[r.priority]||[20,20,20],fontStyle:"bold"}}]],
    margin:{left:M,right:M} });
  y=doc.lastAutoTable.finalY+5;
  // details (dates + status)
  doc.autoTable({ startY:y, theme:"plain", styles:{fontSize:10,cellPadding:1.7},
    columnStyles:{0:{fontStyle:"bold",textColor:[120,120,128],cellWidth:42}},
    body:[
      ["Reference", String(r.ref_no||"—")],
      ["Client", String(r.client_name||"—")],
      ["Status", String(r.status||"—")],
      ["Raised on (date & time)", fmtFull(r.created_at)],
      ["Completed on (date & time)", completed?fmtFull(completed):"— not completed yet"],
      ["Needed by", r.due_date?fmtDay(r.due_date):"—"],
      ["Assigned to", String(r.assigned_name||"Unassigned")],
      ["Tags", (r.tags&&r.tags.length)?r.tags.join(", "):"—"],
    ], margin:{left:M,right:M} });
  y=doc.lastAutoTable.finalY+6;
  // description
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(25,25,30); doc.text("Description",M,y); y+=2;
  doc.autoTable({ startY:y, theme:"grid", styles:{fontSize:10,cellPadding:3.2,textColor:[45,45,50],lineColor:[225,225,232]},
    body:[[ htmlToText(r.description)||"—" ]], margin:{left:M,right:M} });
  y=doc.lastAutoTable.finalY+6;
  // status history
  if((hist||[]).length){
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(25,25,30); doc.text("Status history",M,y); y+=2;
    doc.autoTable({ startY:y, theme:"striped", headStyles:{fillColor:[108,92,231]}, styles:{fontSize:9,cellPadding:2.2},
      head:[["When","Change","By","Note"]],
      body:(hist||[]).map(h=>[ fmtFull(h.created_at), (h.old_status?h.old_status+" → ":"")+h.new_status, h.changed_by_name||"—", h.note||"" ]),
      columnStyles:{0:{cellWidth:42},1:{cellWidth:40},2:{cellWidth:34}}, margin:{left:M,right:M} });
    y=doc.lastAutoTable.finalY+6;
  }
  // commits
  if(commits.length){
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(25,25,30); doc.text("GitHub commits",M,y); y+=2;
    doc.autoTable({ startY:y, theme:"grid", headStyles:{fillColor:[40,40,46]}, styles:{fontSize:9,cellPadding:2},
      head:[["Commit","Message","Added"]],
      body:commits.map(c=>[ String(c.hash||"").replace(/^https?:\/\/.*\//,"").slice(0,14), c.message||"", fmtDay(c.created_at) ]),
      columnStyles:{0:{cellWidth:34},2:{cellWidth:30}}, margin:{left:M,right:M} });
    y=doc.lastAutoTable.finalY+6;
  }
  // footer on every page
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setDrawColor(225,225,232); doc.line(M,288,W-M,288);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(150,150,156);
    doc.text("Generated "+fmtFull(new Date())+" · Stepstones Global India",M,293);
    doc.text("Page "+i+" of "+pages,W-M,293,{align:"right"}); }
  doc.save(String(r.ref_no||"CR")+".pdf");
}

function initDrop(dropId,inputId,rowId,imgId,onPick){
  const d=$(dropId), inp=$(inputId); if(!d||!inp) return;
  const pick=f=>{ if(!f) return; if(!f.type.startsWith("image/")){toast("Please choose an image file.",true);return;}
    onPick(f); const img=$(imgId); if(img){img.src=URL.createObjectURL(f);img.classList.remove("hidden");} const row=$(rowId); if(row) row.classList.remove("hidden"); };
  d.onclick=()=>inp.click();
  d.ondragover=e=>{e.preventDefault();d.classList.add("drag");};
  d.ondragleave=()=>d.classList.remove("drag");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("drag");pick(e.dataTransfer.files[0]);};
  inp.onchange=()=>pick(inp.files[0]);
}

function commitUrl(c,repo){
  if(c.url) return c.url;
  const h=String(c.hash||"").trim();
  if(/^https?:\/\//i.test(h)) return h;
  if(repo){ let r=String(repo).trim().replace(/\.git$/,"").replace(/\/+$/,""); if(!/^https?:\/\//i.test(r)) r="https://"+r.replace(/^\/+/,""); return r+"/commit/"+h; }
  return "";
}
function renderCommits(arr,repo,isAdmin,crId){
  if(!arr||!arr.length) return `<div class="hint">No commits linked yet.</div>`;
  return arr.map(c=>{
    const u=commitUrl(c,repo);
    let short=String(c.hash||"").replace(/^https?:\/\/.*\//,"").slice(0,12)||"commit";
    const label=`<span class="ref">${esc(short)}</span>`;
    return `<div class="att"><span>🔗</span><span class="name">${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`:label}${c.message?` — ${esc(c.message)}`:""}<div class="hint" style="font-size:11px;margin-top:2px">${esc(c.added_by_name||"")} · ${esc(fmtDay(c.created_at))}</div></span>${isAdmin?`<button class="btn btn-sm btn-ghost" onclick="deleteCommit('${c.id}','${crId}')">Remove</button>`:""}</div>`;
  }).join("");
}

function _pdfSafe(x){ return String(x==null?"":x)
  .replace(/→|➔|➤|➜|➙|⇒|⮕|⭢/g,"-> ")
  .replace(/[‘’‚‛]/g,"'")
