function closeModal(){ $("modal-root").innerHTML=""; }
async function saveStatus(id){
  const r=CACHE.find(x=>x.id===id);
  const ns=$("d-status").value, note=$("d-status-note").value.trim();
  if(ns!==r.status){
    const old=r.status;
    const {error}=await sb.from("cr_requests").update({status:ns}).eq("id",id);
    if(error){toast(error.message,true);return;}
    await sb.from("cr_status_history").insert({request_id:id,old_status:old,new_status:ns,
      changed_by:SESSION.user.id,changed_by_name:ME.full_name,note:note||"Status updated"});
    notify("status",id,ns).catch(()=>{});
    r.status=ns; r.updated_at=new Date().toISOString();
  }else if(note){
    await sb.from("cr_status_history").insert({request_id:id,old_status:r.status,new_status:r.status,
      changed_by:SESSION.user.id,changed_by_name:ME.full_name,note});
  }
  toast("Saved."); openDetail(id);
  ME.role==="admin"?renderAdminTable():renderClientTable();
}
function refreshLists(){ try{ if(ME&&ME.role==="admin"){ if($("a-table")) renderAdminTable(); } else { if($("c-table")){ renderClientStats(); renderClientTable(); } } }catch(_){ } }
async function requestClarification(id){
  const note=(($("d-clar-note")&&$("d-clar-note").value)||"").trim();
  if(!note){ toast("Enter what needs clarification.",true); return; }
  const patch={needs_clarification:true,clarification_response:null,clarification_response_at:null,clarification_answered:false,clarification_note:note,clarification_by:(SESSION&&SESSION.user)?SESSION.user.id:null,clarification_by_name:ME.full_name||ME.company||ME.username||"Admin",clarification_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  const {error}=await sb.from("cr_requests").update(patch).eq("id",id);
  if(error){toast(error.message,true);return;}
  const r=CACHE.find(x=>x.id===id); if(r)Object.assign(r,patch);
  try{ await sb.from("cr_comments").insert({request_id:id,author_id:SESSION.user.id,author_name:ME.full_name||ME.username||ME.email,author_role:ME.role,body:"❓ Clarification requested: "+note}); }catch(_){ }
  refreshLists();
  toast("Clarification requested — the client can now respond."); await openDetail(id);
}
async function answerClarification(id){
  const ans=(($("d-clar-answer")&&$("d-clar-answer").value)||"").trim();
  if(!ans){ toast("Type your clarification first.",true); return; }
  const patch={clarification_response:ans,clarification_response_at:new Date().toISOString(),clarification_answered:true,updated_at:new Date().toISOString()};
  const {error}=await sb.from("cr_requests").update(patch).eq("id",id);
  if(error){toast(error.message||"Could not send.",true);return;}
  const r=CACHE.find(x=>x.id===id); if(r)Object.assign(r,patch);
  try{ await sb.from("cr_comments").insert({request_id:id,author_id:SESSION.user.id,author_name:ME.full_name||ME.username||ME.email,author_role:ME.role,body:"✅ Clarification provided: "+ans}); }catch(_){ }
  refreshLists();
  toast("Clarification sent to the admin. Thank you!"); await openDetail(id);
}
async function resolveClarification(id){
  const patch={needs_clarification:false,updated_at:new Date().toISOString()};
  const {error}=await sb.from("cr_requests").update(patch).eq("id",id);
  if(error){toast(error.message,true);return;}
  const r=CACHE.find(x=>x.id===id); if(r)Object.assign(r,patch);
  refreshLists();
  toast("Marked as clarified."); await openDetail(id);
}

let NOTIFS=[], NOTIF_TIMER=null;
function unreadCount(){ return NOTIFS.filter(n=>!n.is_read).length; }
function updateBadge(){
  const b=$("bell-badge"); if(!b) return;
  const n=unreadCount(); b.textContent=n>99?"99+":String(n); b.classList.toggle("hidden",n===0);
}
async function loadNotifs(){
  const {data}=await sb.from("cr_notifications").select("*").order("created_at",{ascending:false}).limit(40);
  NOTIFS=data||[]; updateBadge(); return NOTIFS;
}
function startNotifPolling(){
  if(NOTIF_TIMER) clearInterval(NOTIF_TIMER);
  loadNotifs();
  NOTIF_TIMER=setInterval(async ()=>{
    const before=unreadCount(); await loadNotifs(); const after=unreadCount();
    if(after>before){ const latest=NOTIFS.find(n=>!n.is_read); toast("🔔 "+(latest?latest.title:"New notification")); }
  },30000);
}
async function openNotifs(){
  await loadNotifs();
  const uc=unreadCount();
  $("modal-root").innerHTML=`<div class="overlay overlay-sheet" onclick="if(event.target===this)closeModal()">
    <div class="modal notif-modal">
      <div class="mh"><div><h2 style="margin:0">Notifications</h2><div class="hint">${uc?uc+" unread":"You're all caught up"}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          ${NOTIFS.some(n=>!n.is_read)?`<button class="btn btn-sm btn-ghost" style="width:auto;margin:0" onclick="markAllRead()">Mark all read</button>`:""}
          <button class="x" onclick="closeModal()">×</button></div></div>
      <div class="mb notif-list">${NOTIFS.length?NOTIFS.map(n=>`
        <div class="notif ${n.is_read?'read':'unread'}">
          <div class="dot"></div>
          <div class="notif-main" onclick="openNotif('${n.id}','${n.request_id||''}')">
            <div class="nt">${esc(n.title||'')}</div><div class="nb">${esc(n.body||'')}</div>
            <div class="nm">${fmtDate(n.created_at)}</div>
          </div>
          ${n.is_read?'':`<button class="notif-read" title="Mark as read" onclick="event.stopPropagation();markReadOnly('${n.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>`}
        </div>`).join(""):`<div class="notif-empty"><div class="ne-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 14 6 8"/><path d="M10.2 21a2 2 0 0 0 3.6 0"/></svg></div><div>No notifications yet.</div></div>`}</div>
    </div></div>`;
}
async function markReadOnly(id){ await markRead(id); openNotifs(); }
async function markRead(id){
  await sb.from("cr_notifications").update({is_read:true}).eq("id",id);
  const n=NOTIFS.find(x=>x.id===id); if(n) n.is_read=true; updateBadge();

async function markAllRead(){
  await sb.from("cr_notifications").update({is_read:true}).eq("is_read",false);

async function openNotif(id,reqId){
  await markRead(id);

function makeBreaker(G){ const C=themeC(); let W=G.W,H=G.H;
  const st={pad:{x:W/2,w:Math.min(140,W*0.22),h:14,y:H-50},ball:{x:W/2,y:H/2,vx:4,vy:-5,r:8,stuck:true},bricks:[],score:0,best:gHi("breaker"),lives:3,over:false,win:false,level:1};
  function build(){ st.bricks=[]; const cols=Math.min(12,Math.max(6,Math.floor(W/80))); const bw=(W-40)/cols; const rows=5+Math.min(3,st.level-1); const cols2=["#ff5b6b","#ffb020","#f5c542","#22c55e","#22d3ee","#7c3aed","#e879f9","#3b82f6"]; for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)st.bricks.push({x:20+c*bw,y:80+r*26,w:bw-6,h:20,c:cols2[r%cols2.length],alive:true}); }
  build();
  function hud(){ gameHUD(`<span>Score ${st.score}</span><span>Best ${st.best}</span><span>${st.lives>0?"❤️".repeat(st.lives):"—"}</span>`); } hud();
  function resetBall(){ st.ball.x=st.pad.x; st.ball.y=st.pad.y-18; st.ball.vx=4*(Math.random()<.5?-1:1); st.ball.vy=-5; st.ball.stuck=true; }
  function full(){ st.score=0;st.lives=3;st.level=1;st.over=false;st.win=false;build();resetBall();hud(); }
  return {
    resize(w,h){W=w;H=h;st.pad.y=H-50;st.pad.w=Math.min(140,W*0.22);},
    down(){ if(st.over){full();return;} if(st.win){st.win=false;build();resetBall();return;} st.ball.stuck=false; },
    key(k,d){ if(k===" "&&d){ if(st.over)full(); else if(st.win){st.win=false;build();resetBall();} else st.ball.stuck=false; } },
    update(dt){ const p=st.pad; p.x+=(G.pointer.x-p.x)*Math.min(1,0.3*dt); if(G.keys["ArrowLeft"]||G.keys["a"])p.x-=8*dt; if(G.keys["ArrowRight"]||G.keys["d"])p.x+=8*dt; p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x));
      const b=st.ball; if(st.over||st.win)return; if(b.stuck){ b.x=p.x; b.y=p.y-18; return; }
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);} if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);} if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);}
      if(b.y>H+20){ st.lives--; hud(); if(st.lives<=0){ st.over=true; if(st.score>st.best){st.best=st.score;gSetHi("breaker",st.best);} hud(); } else resetBall(); return; }
      if(b.y+b.r>p.y-p.h/2&&b.y-b.r<p.y+p.h/2&&Math.abs(b.x-p.x)<p.w/2+b.r&&b.vy>0){ b.vy=-Math.abs(b.vy); const off=(b.x-p.x)/(p.w/2); b.vx=off*6; const sp=Math.hypot(b.vx,b.vy)||1; if(sp<6){b.vx*=6/sp;b.vy*=6/sp;} }
      for(const br of st.bricks){ if(!br.alive)continue; if(b.x>br.x-b.r&&b.x<br.x+br.w+b.r&&b.y>br.y-b.r&&b.y<br.y+br.h+b.r){ br.alive=false; st.score+=10; hud(); const ox=Math.min(Math.abs(b.x-br.x),Math.abs(b.x-(br.x+br.w))); const oy=Math.min(Math.abs(b.y-br.y),Math.abs(b.y-(br.y+br.h))); if(ox<oy)b.vx*=-1; else b.vy*=-1; break; } }
      if(st.bricks.every(br=>!br.alive)){ st.level++; st.win=true; if(st.score>st.best){st.best=st.score;gSetHi("breaker",st.best);} hud(); }
    },
    draw(ctx,w,h){ st.bricks.forEach(br=>{ if(!br.alive)return; ctx.fillStyle=br.c; roundRect(ctx,br.x,br.y,br.w,br.h,4); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.18)"; ctx.fillRect(br.x,br.y,br.w,4); });
      const p=st.pad; ctx.fillStyle=C.brand; roundRect(ctx,p.x-p.w/2,p.y-p.h/2,p.w,p.h,7); ctx.fill();
      const b=st.ball; ctx.fillStyle=C.accent; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fill();
      if(st.over) overText(ctx,w,h,"Game Over","Score "+st.score+"  ·  Best "+st.best,C.accent);
      else if(st.win) overText(ctx,w,h,"Level "+st.level+"!","Tap to continue · Score "+st.score,C.accent);
      else if(b.stuck){ ctx.fillStyle="rgba(255,255,255,.85)"; ctx.textAlign="center"; ctx.font="16px system-ui,sans-serif"; ctx.fillText("Tap / Space to launch",w/2,h-90); }
    }
  };
}

function setupAssistant(){
  if(document.getElementById("ai-fab")) return;
  const fab=document.createElement("button"); fab.id="ai-fab"; fab.className="ai-fab"; fab.title="AI Assistant"; fab.innerHTML="🤖"; fab.onclick=toggleAssistant;
  const panel=document.createElement("div"); panel.id="ai-panel"; panel.className="ai-panel hidden";
  panel.innerHTML=`<div class="ai-head"><div><b>🤖 CR Assistant</b><div class="hint">Ask about past change requests</div></div><button class="x" onclick="toggleAssistant()">×</button></div>
    <div class="ai-msgs" id="ai-msgs"></div>
    <div class="ai-input"><input id="ai-q" class="inp" placeholder="e.g. Was the password toggle done?" onkeydown="if(event.key==='Enter')aiSend()"/><button class="btn btn-sm" onclick="aiSend()">Send</button></div>`;
  document.body.appendChild(fab); document.body.appendChild(panel);
  if(!document.getElementById("game-fab")){ const gb=document.createElement("button"); gb.id="game-fab"; gb.className="game-fab"; gb.title="Play Star Defender"; gb.innerHTML="🎮"; gb.onclick=openGame; document.body.appendChild(gb); }
  AI_MSGS=[{role:"assistant",text:"Hi! Ask me anything about your change requests — e.g. “has the retailer registration bug been fixed?”, “list open CRs for BharatOne”, or “when was CR-BHO-2 completed?”"}];
  renderAiMsgs();
}
function toggleAssistant(){ const p=$("ai-panel"); if(!p)return; p.classList.toggle("hidden"); if(!p.classList.contains("hidden")){ const q=$("ai-q"); if(q) setTimeout(()=>q.focus(),60); } }
function aiLinkify(t){
  let h=esc(t); const map={}; (CACHE||[]).forEach(r=>{ if(r.ref_no) map[r.ref_no]=r.id; });
  h=h.replace(/CR-[A-Za-z0-9]+-\d+/g, m=> map[m]?`<a class="ai-ref" onclick="aiOpen('${map[m]}')">${m}</a>`:m);
  return h.replace(/\n/g,"<br>");
}
function aiOpen(id){ const p=$("ai-panel"); if(p) p.classList.add("hidden"); openDetail(id); }
function renderAiMsgs(){ const el=$("ai-msgs"); if(!el)return; el.innerHTML=AI_MSGS.map(m=>`<div class="ai-msg ${m.role}${m.typing?' typing':''}">${m.role==='assistant'&&!m.typing?aiLinkify(m.text):esc(m.text)}</div>`).join(""); el.scrollTop=el.scrollHeight; }
async function aiSend(){
  const inp=$("ai-q"); const q=(inp.value||"").trim(); if(!q)return; inp.value="";
  AI_MSGS.push({role:"user",text:q}); AI_MSGS.push({role:"assistant",text:"…thinking",typing:true}); renderAiMsgs();
  try{
    if(!CACHE||!CACHE.length){ try{ await loadRequests(); }catch(_){ } }
    const hist=AI_MSGS.filter(m=>!m.typing).slice(-8).map(m=>({role:m.role,text:m.text}));
    const data=await callFn("cr-assistant",{question:q,history:hist});
    AI_MSGS=AI_MSGS.filter(m=>!m.typing); AI_MSGS.push({role:"assistant",text:data.answer||"(no answer)"}); renderAiMsgs();
  }catch(e){
    AI_MSGS=AI_MSGS.filter(m=>!m.typing);
    let msg=e.message||"Something went wrong.";
    if(/key|configured/i.test(msg)) msg+=" Add ANTHROPIC_API_KEY (or OPENAI_API_KEY) in Supabase → Edge Functions → Manage secrets.";
    AI_MSGS.push({role:"assistant",text:"⚠️ "+msg}); renderAiMsgs();
  }
}
let THREE_SCENE=null;
let BG_STYLE=(function(){try{return localStorage.getItem("cr_bg_style")||"knot";}catch(_){return "knot";}})();
function setBg(style){ BG_STYLE=style; try{ localStorage.setItem("cr_bg_style",style); localStorage.setItem("cr_bg_user","1"); }catch(_){ } if(typeof THREE_SCENE!=="undefined"&&THREE_SCENE&&THREE_SCENE.rebuild){ try{THREE_SCENE.rebuild();}catch(_){ } } if(typeof renderThemeMenu==="function") renderThemeMenu(); if(typeof autoSaveGlobalIfAdmin==="function") autoSaveGlobalIfAdmin(); }
function init3D(){
  if(typeof THREE==="undefined") return;
  const canvas=document.getElementById("bg3d"); if(!canvas) return;
  let renderer; try{ renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true}); }catch(_){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100); camera.position.z=8;
  const cssVar=n=>{ const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v||"#6c5ce7"; };
  const brand=()=>new THREE.Color(cssVar("--brand")), accent=()=>new THREE.Color(cssVar("--accent"));
  let objs=[], wavesMesh=null, coinTex=null;
  function makeCoinTex(){ const cv=document.createElement("canvas"); cv.width=cv.height=64; const g=cv.getContext("2d"); const grd=g.createRadialGradient(26,22,4,32,32,30); grd.addColorStop(0,"#ffe89a"); grd.addColorStop(.5,"#f5c542"); grd.addColorStop(1,"#b8860b"); g.beginPath(); g.arc(32,32,28,0,Math.PI*2); g.fillStyle=grd; g.fill(); g.lineWidth=3; g.strokeStyle="#8a6508"; g.stroke(); g.fillStyle="#8a6508"; g.font="bold 34px Georgia,serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("$",32,34); return new THREE.CanvasTexture(cv); }
  function addWire(geo,color,opacity,rot){ const m=new THREE.MeshBasicMaterial({color:color,wireframe:true,transparent:true,opacity:opacity,blending:THREE.AdditiveBlending,depthWrite:false}); const mesh=new THREE.Mesh(geo,m); mesh.userData.rot=rot||{x:.0015,y:.002}; scene.add(mesh); objs.push(mesh); return mesh; }
  function addPoints(n,size,color,opacity){ const p=new Float32Array(n*3); for(let i=0;i<n*3;i++) p[i]=(Math.random()-0.5)*26; const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(p,3)); const m=new THREE.PointsMaterial({color:color,size:size,transparent:true,opacity:opacity,blending:THREE.AdditiveBlending,depthWrite:false}); const pts=new THREE.Points(g,m); pts.userData.rot={x:0,y:.0006}; scene.add(pts); objs.push(pts); return pts; }
  function build(){
    objs.forEach(x=>{ scene.remove(x); if(x.geometry)x.geometry.dispose(); if(x.material)x.material.dispose(); }); objs=[]; wavesMesh=null;
    const st=(typeof BG_STYLE!=="undefined"&&BG_STYLE)||"knot"; const b=brand(), a=accent();
    if(st==="off"){ canvas.style.display="none"; return; } canvas.style.display="";
    if(st==="knot"){ addWire(new THREE.IcosahedronGeometry(2.9,1),b,.4); addWire(new THREE.TorusKnotGeometry(1.5,0.42,140,14),a,.28,{x:-.0018,y:-.0024}); addPoints(650,.06,b,.7); }
    else if(st==="globe"){ addWire(new THREE.SphereGeometry(2.8,26,20),b,.4,{x:.0006,y:.0016}); addWire(new THREE.SphereGeometry(1.35,16,12),a,.26,{x:-.001,y:.002}); addPoints(520,.05,b,.6); }
    else if(st==="particles"){ addPoints(1500,.05,b,.8); addPoints(620,.06,a,.55); }
    else if(st==="rings"){ addWire(new THREE.TorusGeometry(2.6,.5,14,80),b,.4,{x:.001,y:.002}); const t2=addWire(new THREE.TorusGeometry(1.75,.34,12,60),a,.3,{x:-.0016,y:.0024}); t2.rotation.x=Math.PI/3; addPoints(520,.05,b,.6); }
    else if(st==="waves"){ wavesMesh=addWire(new THREE.PlaneGeometry(18,18,44,44),b,.34,{x:0,y:.0009}); wavesMesh.rotation.x=-Math.PI/2.4; addPoints(420,.05,a,.5); }
    else if(st==="crystal"){ addWire(new THREE.OctahedronGeometry(2.8,0),b,.46,{x:.0012,y:.0018}); addWire(new THREE.OctahedronGeometry(1.7,0),a,.32,{x:-.0016,y:.0022}); addWire(new THREE.DodecahedronGeometry(3.7,0),b,.15,{x:.0006,y:-.001}); addPoints(500,.05,b,.6); }
    else if(st==="money"){ if(!coinTex) coinTex=makeCoinTex(); for(let i=0;i<64;i++){ const mm=new THREE.SpriteMaterial({map:coinTex,transparent:true,opacity:.92,depthWrite:false}); const sp=new THREE.Sprite(mm); const sz=0.5+Math.random()*0.8; sp.scale.set(sz,sz,sz); sp.position.set((Math.random()-0.5)*22,Math.random()*22-6,(Math.random()-0.5)*8); sp.userData.money=true; sp.userData.vy=0.03+Math.random()*0.06; sp.userData.sway=Math.random()*Math.PI*2; sp.userData.rot={x:0,y:0}; scene.add(sp); objs.push(sp); } }
    else if(st==="space"){ const mk=(n,size,color,op)=>{ const p=new Float32Array(n*3); for(let i=0;i<n;i++){ p[i*3]=(Math.random()-0.5)*42; p[i*3+1]=(Math.random()-0.5)*30; p[i*3+2]=-Math.random()*60+8; } const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(p,3)); const mm=new THREE.PointsMaterial({color:color,size:size,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}); const pt=new THREE.Points(g,mm); pt.userData.space=true; pt.userData.rot={x:0,y:0}; scene.add(pt); objs.push(pt); }; mk(1300,.10,b,.95); mk(650,.15,a,.8); mk(1700,.05,b,.6); }
    else { addWire(new THREE.IcosahedronGeometry(2.9,1),b,.4); addPoints(650,.06,b,.7); }
  }
  build();
  let mx=0,my=0; window.addEventListener("mousemove",e=>{ mx=(e.clientX/innerWidth-.5); my=(e.clientY/innerHeight-.5); });
  function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  window.addEventListener("resize",resize); resize();
  const _t0=Date.now();
  (function tick(){ requestAnimationFrame(tick);
    if(typeof BG_STYLE==="undefined"||BG_STYLE!=="off"){
      objs.forEach(x=>{ const r=x.userData.rot||{}; x.rotation.x+=r.x||0; x.rotation.y+=r.y||0; if(x.userData.money){ x.position.y-=x.userData.vy; x.userData.sway+=0.03; x.position.x+=Math.sin(x.userData.sway)*0.012; if(x.material)x.material.rotation+=0.02; if(x.position.y<-8){ x.position.y=9+Math.random()*7; x.position.x=(Math.random()-0.5)*22; } } if(x.userData.space){ const ps=x.geometry.attributes.position; for(let i=0;i<ps.count;i++){ let z=ps.getZ(i)+0.16; if(z>9){ z-=68; ps.setX(i,(Math.random()-0.5)*42); ps.setY(i,(Math.random()-0.5)*30); } ps.setZ(i,z); } ps.needsUpdate=true; } });
      if(wavesMesh){ const t=(Date.now()-_t0)/1000; const ps=wavesMesh.geometry.attributes.position; for(let i=0;i<ps.count;i++){ const x=ps.getX(i), y=ps.getY(i); ps.setZ(i, Math.sin(x*0.5+t)*0.6+Math.cos(y*0.5+t*.8)*0.6); } ps.needsUpdate=true; }
      camera.position.x+=(mx*1.6-camera.position.x)*.04; camera.position.y+=(-my*1.6-camera.position.y)*.04; camera.lookAt(0,0,0); renderer.render(scene,camera);
    }
  })();
  THREE_SCENE={ recolor:()=>{ build(); }, rebuild:()=>{ build(); } };
}
function animCount(el){
  if(el.dataset.an) return;
  const raw=el.textContent.trim();
  const m=raw.match(/^(₹)?([\d,]+(\.\d+)?)(%)?$/);
  if(!m){ return; }
  el.dataset.an="1";
  if(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const prefix=m[1]||"", suffix=m[4]||"", target=parseFloat(m[2].replace(/,/g,"")), dec=m[3]?1:0;
  const dur=950, t0=performance.now();
  (function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3), v=target*e;
    el.textContent=prefix+(dec?v.toFixed(1):Math.round(v).toLocaleString("en-IN"))+suffix;
    if(p<1) requestAnimationFrame(step); else el.textContent=raw; })(t0);
}
function watchCounters(){
  const scan=()=>document.querySelectorAll(".stat .n, .rep-stat .n").forEach(animCount);
  const root=document.getElementById("app-body")||document.body;
  try{ new MutationObserver(scan).observe(root,{childList:true,subtree:true}); }catch(_){}
  scan();
}
function setupTilt(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const sel=".stat,.rep-stat,.rep-card,.card,.client-card,.bcard,.lead-due";
  let cur=null;
  document.addEventListener("pointermove",e=>{
    const card=e.target.closest?e.target.closest(sel):null;
    if(card!==cur){ if(cur){cur.style.transition="";cur.style.transform="";} cur=card; if(cur){cur.style.transition="transform .06s linear";cur.style.transformStyle="preserve-3d";cur.style.willChange="transform";} }
    if(cur){ const r=cur.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5; cur.style.transform=`perspective(900px) rotateX(${(-py*7).toFixed(2)}deg) rotateY(${(px*7).toFixed(2)}deg) translateY(-5px)`; }
  },{passive:true});
  document.addEventListener("pointerout",e=>{ if(cur && (!e.relatedTarget || !cur.contains(e.relatedTarget))){ cur.style.transition="";cur.style.transform="";cur=null; } },{passive:true});
}
if(sb) sb.auth.onAuthStateChange((_e,s)=>{SESSION=s;});
(function(){
  if(window.__crAnimObs)return;
  const SEL=".proj-card,.client-card,.scr-card,.dm-card,.fold-card,.proj-fold,.pf-card,.set-row,.pf-stat,.ln-stat,.stat";
  function tag(root){ if(root.nodeType!==1)return; const nodes=[]; try{ if(root.matches&&root.matches(SEL))nodes.push(root); if(root.querySelectorAll)root.querySelectorAll(SEL).forEach(n=>nodes.push(n)); }catch(_){ return; } let i=0; nodes.forEach(n=>{ if(n.__crd)return; n.__crd=1; n.style.animationDelay=Math.min(i*45,360)+"ms"; n.classList.add("cra"); i++; }); }
  try{ const obs=new MutationObserver(muts=>{ muts.forEach(m=>{ if(m.addedNodes) m.addedNodes.forEach(tag); }); }); obs.observe(document.body,{childList:true,subtree:true}); window.__crAnimObs=obs; }catch(_){ }
})();
try{ init3D(); }catch(_){}
try{ setupTilt(); }catch(_){}
try{ watchCounters(); }catch(_){}
