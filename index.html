<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b1220"/>
<title>Stepstones Solutions — Agency Workspace</title>
<link rel="icon" href="assets/stepstones-logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f3; --panel:#ffffff; --panel2:#f8faf7; --line:#e7eae3; --line2:#eef1ea;
  --ink:#0f1a2a; --ink2:#243244; --muted:#6a7686; --faint:#9aa4b2;
  --green:#2563eb; --green2:#0ea5e9; --green-600:#2563eb; --green-ink:#0b3b8f;
  --grad:linear-gradient(135deg,#2563eb 0%,#0ea5e9 55%,#06b6d4 100%);
  --tint:#e8f1fe; --tint2:#d3e4fd; --amber:#b4740f; --amber-tint:#fbf1df;
  --red:#c23b3b; --red-tint:#fbe9e9; --blue:#2563eb; --blue-tint:#e6effd; --purple:#7c3aed; --purple-tint:#efe9fd;
  --side:#0b1220; --side2:#111a2b; --side-ink:#aab6c7; --side-faint:#5b6678;
  --r:18px; --r2:14px; --r3:11px;
  --sh:0 1px 2px rgba(16,26,42,.04),0 10px 30px -18px rgba(16,26,42,.22);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-head:'Plus Jakarta Sans','Inter',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55;letter-spacing:-.1px}
a{color:inherit;text-decoration:none}
h1,h2,h3,.sec-title,.ph h1,.auth-box h2,.auth-art h1,.doc-title,.fv,.stat .val,.rep-m .rv,.fin-s .fv,.cw-head h1,.proj-bar h3,.brand b,.sheet-h h3,.donut-center b{font-family:var(--font-head);letter-spacing:-.4px}
.nav a,.btn,.tag,.status,.sec-title{font-family:var(--font-head)}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d6dbd3;border-radius:8px;border:3px solid var(--bg)}

/* ---------- in-app Proposal Studio ---------- */
.st-ov{position:fixed;inset:0;z-index:140;background:var(--bg);display:flex;flex-direction:column;animation:fadein .18s ease}
.st-bar{flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--side);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.st-ti{font-family:var(--font-head);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;color:#fff}
.st-mk{color:#22d3ee}
.st-back{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;font-family:var(--font-head);font-weight:600;font-size:13px}
.st-back:hover{background:rgba(255,255,255,.14)}
.st-rf{margin-left:auto;background:var(--green);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-family:var(--font-head);font-weight:600;font-size:13px}
.st-rf:hover{filter:brightness(1.08)}
.st-if{flex:1;width:100%;border:0;background:#fff}


/* ---------- LOGIN ---------- */
.auth{display:grid;grid-template-columns:1fr 1fr;height:100vh}
.auth-art{background:radial-gradient(120% 90% at 20% 10%,#12325f 0%,#0b1220 55%);color:#fff;padding:54px 60px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art .steps{position:absolute;inset:0;background:
  linear-gradient(transparent 49.5%,rgba(34,211,238,.10) 49.5% 50.5%,transparent 50.5%) 0 0/100% 90px,
  linear-gradient(90deg,transparent 49.5%,rgba(34,211,238,.07) 49.5% 50.5%,transparent 50.5%) 0 0/120px 100%;
  -webkit-mask:radial-gradient(70% 70% at 80% 30%,#000,transparent);mask:radial-gradient(70% 70% at 80% 30%,#000,transparent);opacity:.5}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.brand .mk{display:grid;grid-template-columns:repeat(2,13px);grid-template-rows:repeat(2,13px);gap:4px}
.brand .mk i{border-radius:5px;background:#2563eb}.brand .mk i:nth-child(2){background:#0ea5e9}.brand .mk i:nth-child(3){background:#06b6d4}.brand .mk i:nth-child(4){background:#22d3ee;opacity:.75}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.2px;line-height:1.05}
.auth-art h1{font-size:46px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;margin:0 0 16px;position:relative;z-index:2}
.auth-art p{color:#aeb9c9;font-size:17px;max-width:420px;position:relative;z-index:2}
.auth-cards{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;margin-top:26px}
.ac{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(6px)}
.ac .ic{width:34px;height:34px;border-radius:9px;background:rgba(34,211,238,.14);color:#22d3ee;display:grid;place-items:center}
.ac b{font-size:14px}.ac .pill{margin-left:auto;font-size:11px;background:rgba(34,211,238,.16);color:#67e8f9;padding:3px 9px;border-radius:999px;font-weight:700}
.auth-foot{color:#6b7688;font-size:13px;display:flex;gap:10px;align-items:center;position:relative;z-index:2}
.auth-form{background:#f6f7f4;display:flex;flex-direction:column;justify-content:center;padding:54px 72px}
.auth-form .top{display:flex;justify-content:flex-end;color:var(--green);font-weight:600;font-size:13px}
.auth-box{max-width:420px;width:100%;margin:0 auto}
.auth-box h2{font-size:38px;font-weight:800;letter-spacing:-1px;margin:0 0 6px}
.auth-box .sub{color:var(--muted);margin-bottom:22px}
.seg{display:flex;background:#e9ece6;border-radius:12px;padding:5px;margin-bottom:22px}
.seg button{flex:1;border:0;background:transparent;padding:11px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:#d3e4fd;color:var(--green-ink)}
.fld{margin-bottom:16px}
.fld label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}
.inp{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14.5px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(26,154,75,.14)}
.inp-ic{position:relative}.inp-ic .inp{padding-left:42px}.inp-ic svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.inp-ic .eye{left:auto;right:12px;cursor:pointer;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:15px;background:var(--grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s}
.btn:hover{background:#13713a}.btn:active{transform:scale(.99)}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#fafbf9}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
.auth-msg{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.rowb{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}
.rowb a{color:var(--green);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}

/* ---------- APP SHELL ---------- */
.app{display:grid;grid-template-columns:252px 1fr;height:100vh;overflow:hidden}
.side{background:var(--side);display:flex;flex-direction:column;padding:20px 14px;color:var(--side-ink)}
.side .brand{padding:6px 10px 20px}.side .brand b{color:#fff}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--side-ink);font-weight:600;font-size:14px;position:relative}
.nav a svg{width:19px;height:19px;flex:0 0 auto;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:var(--grad);color:#fff}
.nav a.on svg{opacity:1}
.nav a .cnt{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
.nav a.on .cnt{background:rgba(255,255,255,.25)}
.side-user{border-top:1px solid rgba(255,255,255,.08);padding-top:14px;margin-top:10px;display:flex;align-items:center;gap:10px}
.side-user .av{width:36px;height:36px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.side-user b{color:#fff;font-size:13.5px;display:block;line-height:1.2}
.side-user span{color:var(--side-faint);font-size:12px}
.side-user .cv{margin-left:auto;color:var(--side-faint)}

.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{height:68px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 30px;border-bottom:1px solid var(--line);background:rgba(244,246,243,.86);backdrop-filter:blur(8px)}
.crumb{color:var(--muted);font-weight:600;font-size:14px}.crumb b{color:var(--ink)}.crumb .sep{margin:0 8px;color:var(--faint)}
.search{margin-left:auto;position:relative;width:min(420px,38vw)}
.search input{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 40px;font-size:14px;outline:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.icon-btn{width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);position:relative}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--green2);border:2px solid #fff}
.top-av{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
.content{flex:1;overflow-y:auto;padding:26px 30px}

/* ---------- PAGE HEADER ---------- */
.ph{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.ph .ph-ic{width:52px;height:52px;border-radius:14px;background:var(--tint);color:var(--green);display:grid;place-items:center;flex:0 0 auto}
.ph h1{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1.05}
.ph .psub{color:var(--muted);margin-top:4px;font-size:15px}
.ph .ph-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill-demo{background:var(--tint);color:var(--green-ink);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.selectbox{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}

/* ---------- CARDS / STATS ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:20px}
.grid{display:grid;gap:16px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.stat .st-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px;background:var(--tint);color:var(--green)}
.stat .st-top{display:flex;align-items:flex-start;justify-content:space-between}
.stat .spark{width:88px;height:34px}
.stat .lbl{color:var(--muted);font-size:13.5px;font-weight:600}
.stat .val{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:2px 0 6px}
.delta{font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.delta.up{color:var(--green-600)}.delta.dn{color:var(--red)}.delta.flat{color:var(--faint)}
.delta .vs{color:var(--faint);font-weight:600}

.sec-title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1.9fr 1fr;gap:16px}
.chip-tabs{display:inline-flex;background:#eef1ea;border-radius:10px;padding:3px}
.chip-tabs button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.chip-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* attention list */
.att{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fff}
.att:hover{border-color:var(--green2)}
.att .ai{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.att b{display:block;font-size:14.5px}.att span{color:var(--muted);font-size:13px}
.att .cv{margin-left:auto;color:var(--faint)}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.rowlink:hover td{background:var(--panel2)}
.cell-lead{display:flex;align-items:center;gap:11px}
.av2{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 auto;font-size:13px}
.sub1{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;background:#eef1ea;color:var(--ink2);font-weight:700;font-size:12px;padding:4px 9px;border-radius:8px;margin-right:5px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:999px}
.status.g{background:var(--tint);color:var(--green-ink)}
.status.a{background:var(--amber-tint);color:var(--amber)}
.status.b{background:var(--blue-tint);color:var(--blue)}
.status.r{background:var(--red-tint);color:var(--red)}
.status.n{background:#eef1ea;color:var(--muted)}
.status.p{background:var(--purple-tint);color:var(--purple)}
.prog{height:7px;border-radius:5px;background:#eef1ea;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--green)}
.linkg{color:var(--green);font-weight:700;display:inline-flex;align-items:center;gap:5px}

.upc{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line2)}
.upc:last-child{border-bottom:0}
.upc .dt{text-align:center;flex:0 0 auto;width:40px}
.upc .dt b{display:block;font-size:19px;font-weight:800;line-height:1}.upc .dt span{font-size:11px;color:var(--faint);text-transform:uppercase;font-weight:700}
.upc .ti b{font-size:14px}.upc .ti span{color:var(--muted);font-size:12.5px;display:block}

.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .ei{width:64px;height:64px;border-radius:18px;background:var(--tint);color:var(--green);display:grid;place-items:center;margin:0 auto 14px}
.skel{background:linear-gradient(90deg,#eef1ea 25%,#f6f8f4 37%,#eef1ea 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#9f2c2c}

@media(max-width:1100px){.stat-row{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:252px;z-index:120;transform:translateX(-100%);transition:.25s}.side.open{transform:none}.search{display:none}.auth{grid-template-columns:1fr}.auth-art{display:none}.auth-form{padding:36px 22px}.ph h1{font-size:26px}}

/* list + preview layout */
.utabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 18px}
.utabs button{border:0;background:transparent;padding:11px 4px;margin-right:20px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.utabs button.on{color:var(--green);border-bottom-color:var(--green)}
.lp{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.lp .rowlink.sel td{background:var(--tint)!important}
.lp .rowlink.sel td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.filterbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.filterbar .search2{position:relative;flex:1;max-width:260px}
.filterbar .search2 input{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;padding:0 12px 0 38px;background:#fff;outline:none}
.filterbar .search2 svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
/* branded doc preview */
.doc{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.doc-top{position:relative;padding:20px 20px 16px;background:linear-gradient(120deg,#fff, #f1f8f3);overflow:hidden}
.doc-top::after{content:"";position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#d8efe0,transparent 70%)}
.doc-brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--ink);font-size:12px;letter-spacing:.3px;position:relative;z-index:2}
.doc-brand .mk{display:grid;grid-template-columns:repeat(2,9px);grid-template-rows:repeat(2,9px);gap:3px}
.doc-brand .mk i{border-radius:3px;background:#15803d}.doc-brand .mk i:nth-child(1){background:#22d3ee}.doc-brand .mk i:nth-child(4){opacity:.5}
.doc-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:12px 0 2px;position:relative;z-index:2}
.doc-prep{color:var(--muted);font-size:13px;position:relative;z-index:2}
.doc-body{padding:16px 20px 18px}
.doc-sec{font-weight:800;font-size:13.5px;margin:12px 0 7px}
.doc-li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-bottom:5px;color:var(--ink2)}
.doc-li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:6px;flex:0 0 auto}
.inv-tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.inv-tbl div{display:flex;justify-content:space-between;padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.inv-tbl div:last-child{border-bottom:0}.inv-tbl .k{background:#f6f8f4;font-weight:600}
.timeline{display:flex;justify-content:space-between;margin:16px 0 4px;gap:4px}
.tl{flex:1;text-align:center;position:relative}
.tl .d{width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--green);display:grid;place-items:center;margin:0 auto 6px;font-weight:800;border:2px solid #fff;box-shadow:0 0 0 2px var(--tint2);position:relative;z-index:2}
.tl.off .d{background:#eef1ea;color:var(--faint);box-shadow:0 0 0 2px #eef1ea}
.tl::before{content:"";position:absolute;left:-50%;top:13px;width:100%;height:2px;background:var(--tint2)}
.tl:first-child::before{display:none}
.tl b{font-size:12.5px;display:block}.tl span{font-size:11px;color:var(--faint)}
.sigwf{margin-top:6px}
.sigrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.sigrow:last-child{border-bottom:0}
.sigrow .si{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.sigrow .si.ok{background:var(--tint);color:var(--green)}.sigrow .si.pend{background:var(--amber-tint);color:var(--amber)}
.sigrow b{font-size:13.5px}.sigrow span{color:var(--muted);font-size:12px;display:block}
.sigrow .when{margin-left:auto;color:var(--faint);font-size:12px}
.sigbar{height:7px;border-radius:5px;background:#eef1ea;overflow:hidden;margin:8px 0 4px}.sigbar i{display:block;height:100%;background:var(--green)}
.tplrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.tpl{flex:1;min-width:200px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer}

<script>
/* ================= CONFIG ================= */
const SB_URL="https://lcmfrvhugifotbmjwjcv.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjbWZydmh1Z2lmb3RibWp3amN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MzEwNDUsImV4cCI6MjEwOTIwNzA0NX0.-v6jLnRIgzbtOkW9wVii3uVwr7tXa4XWxRJpnzmQBL0";

/* ================= STATE/HELPERS ================= */

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function doLogin(){
  const id=$("#li-id").value.trim(), pw=$("#li-pw").value, msg=$("#auth-msg"), btn=$("#li-btn");
  if(!id||!pw){msg.textContent="Enter your credentials.";return;}
  btn.disabled=true;btn.textContent="Signing in…";msg.textContent="";
  try{
    let email=id;
    if(LOGIN_MODE==="client"&&!id.includes("@")){ const {data}=await sb.rpc("cr_resolve_login",{identifier:id}); if(data)email=data; else email=id.toLowerCase()+"@"+CLIENT_DOMAIN; }
    else if(LOGIN_MODE==="client"){ const {data}=await sb.rpc("cr_resolve_login",{identifier:id}); if(data)email=data; }
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error)throw error;
    await boot();
  }catch(e){ msg.textContent=(e&&e.message)||"Sign in failed."; btn.disabled=false; btn.textContent="Sign in →"; }
}

function areaDS(data,color,fillTop,fillBot){ return {data,borderColor:color,borderWidth:2.4,tension:.42,pointRadius:0,fill:true,backgroundColor:(ctx)=>{const c=ctx.chart.ctx,g=c.createLinearGradient(0,0,0,220);g.addColorStop(0,fillTop);g.addColorStop(1,fillBot);return g;}}; }

function doughnut(id,labels,data,colors){ chart(id,{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:"70%",plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+": "+c.formattedValue}}}}}); }
function barChart(id,labels,data,color){ chart(id,{type:"bar",data:{labels,datasets:[{data,backgroundColor:(c)=>{const x=c.chart.ctx,g=x.createLinearGradient(0,0,0,200);g.addColorStop(0,color);g.addColorStop(1,color+"66");return g;},borderRadius:7,maxBarThickness:30}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>"₹"+Number(c.raw).toLocaleString("en-IN")}}},scales:{x:{grid:{display:false},ticks:{color:"#9aa4b2"}},y:{grid:{color:"#eef1ea"},ticks:{color:"#9aa4b2",callback:v=>v>=1000?(v/1000)+"K":v}}}}}); }
function daysBack(n){const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d);}return a;}

  c.innerHTML=`<div class="ph"><div class="ph-ic">${IC.calendar}</div><div><h1>Content Calendar</h1><div class="psub">Plan, review and schedule every client's content.</div></div><div class="ph-r"><button class="btn ghost">⬇ Export</button>${canStaff()?`<button class="btn" onclick="ccNew()"><span>${IC.plus}</span> Create content</button>`:""}</div></div><div id="cc-body"><div class="psub">Loading…</div></div>`;
  if(!CLIENTS.length){const {data}=await sb.from("cr_profiles").select("id,company,full_name,username").eq("role","client");CLIENTS=data||[];}
  const {data}=await sb.from("cr_content_items").select("*").order("planned_at");
  CC=data||[]; if(!CC_SEL&&CC.length)CC_SEL=CC[0].id;

function ccStat(label){return CC.filter(x=>x.status===label).length;}
function ccRender(){
  const b=$("#cc-body"); if(!b)return;
  const plats=[...new Set(CC.map(x=>x.platform).filter(Boolean))];
  b.innerHTML=`<div class="stat-row">${psStat(IC.calendar,"#15803d","Planned",String(ccStat("Planned")).padStart(2,"0"),"")}${psStat(IC.projects,"#15803d","In production",String(ccStat("In Production")).padStart(2,"0"),"")}${psStat(IC.approvals,"#b4740f","Awaiting approval",String(ccStat("Client Approval")).padStart(2,"0"),"")}${psStat(IC.contracts,"#0891b2","Scheduled",String(ccStat("Scheduled")).padStart(2,"0"),"")}</div>
  <div class="cal-controls"><select class="selectbox" onchange="CC_CLIENT=this.value;ccRender()"><option value="">All clients</option>${CLIENTS.map(c=>`<option value="${c.id}" ${CC_CLIENT===c.id?'selected':''}>${esc(c.company||c.full_name)}</option>`).join("")}</select><select class="selectbox" onchange="CC_PLAT=this.value;ccRender()"><option value="">All platforms</option>${plats.map(p=>`<option ${CC_PLAT===p?'selected':''}>${esc(p)}</option>`).join("")}</select></div>
  <div class="calwrap"><div class="cal"><div class="cal-h"><h3>${CC_REF.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</h3><div class="cal-nav"><button onclick="ccNav(-1)">‹</button><button onclick="ccNav(1)">›</button><button class="btn ghost sm" style="width:auto" onclick="CC_REF=new Date();ccRender()">Today</button></div></div>
  <div class="cal-dow">${["SUN","MON","TUE","WED","THU","FRI","SAT"].map(d=>`<div>${d}</div>`).join("")}</div><div class="cal-grid">${ccGrid()}</div>

  <div class="card pad cdet" id="cc-det"></div></div>`;

}
function ccFiltered(){ return CC.filter(x=>(!CC_CLIENT||x.client_id===CC_CLIENT)&&(!CC_PLAT||x.platform===CC_PLAT)); }
function ccNav(n){CC_REF=new Date(CC_REF.getFullYear(),CC_REF.getMonth()+n,1);ccRender();}
function ccGrid(){
  const rows=ccFiltered(); const byDay={}; rows.forEach(r=>{if(r.planned_at){const k=new Date(r.planned_at).toDateString();(byDay[k]=byDay[k]||[]).push(r);}});
  const first=new Date(CC_REF.getFullYear(),CC_REF.getMonth(),1); const start=new Date(first); start.setDate(1-first.getDay());
  const today=new Date().toDateString(); let out="";
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const oth=d.getMonth()!==CC_REF.getMonth();const items=byDay[d.toDateString()]||[];
    out+=`<div class="cal-c ${oth?'oth':''} ${d.toDateString()===today?'today':''}"><div class="cd">${d.getDate()}</div>${items.slice(0,3).map(r=>{const col=CC_STC[r.status]||["#6b7280","#eef1ea"];const t=r.planned_at?new Date(r.planned_at).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}):"";return `<div class="ev ${CC_SEL===r.id?'sel':''}" style="background:${col[1]};color:${col[0]}" onclick="CC_SEL='${r.id}';ccRender()"><b>${esc(clientName(r.client_id))}</b></div><div class="ev" style="background:transparent;color:${col[0]};padding:0 6px;margin-top:-2px"><small>${esc(r.content_type||r.platform||"")} ${t}</small></div>`;}).join("")}${items.length>3?`<div class="sub1" style="font-size:10px">+${items.length-3} more</div>`:""}</div>`;}
  return out;
}
async function ccDetail(){
  const el=$("#cc-det"); if(!el)return; const r=CC.find(x=>x.id===CC_SEL);
  if(!r){el.innerHTML=`<div class="empty"><div class="ei">${IC.calendar}</div><div>Select a content item</div></div>`;return;}

  <div class="btnrow">${ME.role==='client'&&r.status==='Client Approval'?`<button class="btn block" onclick="ccDecide('${r.id}','Approved')">✓ Approve content</button>`:`<button class="btn block" onclick="location.hash='#/approvals'">Review content</button>`}</div>
  ${ME.role==='client'&&r.status==='Client Approval'?`<button class="btn ghost block" style="margin-top:8px" onclick="ccChanges('${r.id}')">Request changes</button>`:""}
  <div class="sub1" style="margin-top:10px;text-align:center">Publishing requires approval.</div>`;

function supaImg(path){ return path?sb.storage.from("cr-logos").getPublicUrl(path).data.publicUrl:""; }
async function ccDecide(id,st){ await sb.from("cr_content_items").update({status:st,updated_at:new Date().toISOString()}).eq("id",id); const r=CC.find(x=>x.id===id); if(r)r.status=st; toast("Marked "+st); ccRender(); }
async function ccChanges(id){ const n=prompt("What changes are needed?"); if(n===null)return; await sb.from("cr_content_items").update({status:"Changes Requested",approval_comment:n}).eq("id",id); const r=CC.find(x=>x.id===id);if(r){r.status="Changes Requested";r.approval_comment=n;} toast("Changes requested"); ccRender(); }

let AP=[], AP_SEL=null, AP_TAB="await";
async function viewApprovals(c){
  c.innerHTML=`<div class="ph"><div class="ph-ic">${IC.approvals}</div><div><h1>Approvals</h1><div class="psub">Clear feedback. Faster approvals. Better work.</div></div><div class="ph-r"><button class="btn ghost">🔗 Share review link</button></div></div><div id="ap-body"><div class="psub">Loading…</div></div>`;
  if(!CLIENTS.length){const {data}=await sb.from("cr_profiles").select("id,company,full_name,username").eq("role","client");CLIENTS=data||[];}
  const {data}=await sb.from("cr_content_items").select("*").order("planned_at");
  AP=data||[]; apRender();
}
function apQueue(){ return AP.filter(x=>{ if(AP_TAB==="await")return["Client Approval","Internal Review"].includes(x.status); if(AP_TAB==="changes")return x.status==="Changes Requested"; if(AP_TAB==="approved")return["Approved","Scheduled","Published"].includes(x.status); return true; }); }
function apRender(){
  const b=$("#ap-body"); if(!b)return;
  const awaitN=AP.filter(x=>["Client Approval","Internal Review"].includes(x.status)).length;
  const chg=AP.filter(x=>x.status==="Changes Requested").length;
  const mKey=new Date().toISOString().slice(0,7);
  const appr=AP.filter(x=>["Approved","Scheduled","Published"].includes(x.status)&&String(x.updated_at||x.planned_at||"").slice(0,7)===mKey).length;
  const overdue=AP.filter(x=>x.status==="Client Approval"&&x.planned_at&&new Date(x.planned_at)<new Date()).length;
  const q=apQueue(); if(!AP_SEL&&q.length)AP_SEL=q[0].id;
  b.innerHTML=`<div class="stat-row">${psStat(IC.approvals,"#15803d","Awaiting review",String(awaitN).padStart(2,"0"),"")}${psStat('<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',"#b4740f","Changes requested",String(chg).padStart(2,"0"),"")}${psStat(IC.approvals,"#15803d","Approved this month",String(appr).padStart(2,"0"),"")}${psStat('<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg>',"#c23b3b","Overdue",String(overdue).padStart(2,"0"),"")}</div>
  <div class="utabs">${[["await","Awaiting review"],["changes","Changes requested"],["approved","Approved"]].map(([k,l])=>`<button class="${AP_TAB===k?'on':''}" onclick="AP_TAB='${k}';AP_SEL=null;apRender()">${l}</button>`).join("")}</div>
  <div class="appr"><div class="card pad"><div class="card-h"><h3 class="sec-title" style="font-size:16px">Review queue (${q.length})</h3></div>${q.map(r=>{const col=CC_STC[r.status]||["#6b7280","#eef1ea"];return `<div class="q-item ${AP_SEL===r.id?'sel':''}" onclick="AP_SEL='${r.id}';apRender()"><div class="th" style="display:grid;place-items:center;color:var(--green)">${IC.assets}</div><div style="flex:1;min-width:0"><b>${esc(clientName(r.client_id))}</b><div class="m">${esc(r.content_type||r.platform||"Content")} · v${r.version||1}</div><span class="status" style="background:${col[1]};color:${col[0]};font-size:11px;padding:3px 8px;margin-top:4px;display:inline-block">${esc(r.status)}</span></div></div>`;}).join("")||`<div class="psub" style="padding:20px;text-align:center">Nothing here.</div>`}</div>
  <div class="card pad" id="ap-center"></div>
  <div class="card pad" id="ap-fb"></div></div>`;
  apCenter();
}

  const steps=[["Internal review",["Approved","Scheduled","Published","Client Approval"].includes(r.status)?"ok":(r.status==="Internal Review"?"pend":"off")],["Client approval",["Approved","Scheduled","Published"].includes(r.status)?"ok":(r.status==="Client Approval"?"pend":"off")],["Scheduled",["Scheduled","Published"].includes(r.status)?"ok":"off"]];

  <div class="steps3">${steps.map(([l,s])=>`<div class="step3 ${s}"><div class="s3i">${s==='ok'?'✓':(s==='pend'?'…':'·')}</div><b>${l}</b><span>${s==='ok'?'Complete':(s==='pend'?'Pending':'Not started')}</span></div>`).join("")}</div>

  <button class="btn ghost block" style="margin-top:8px;color:var(--amber)" onclick="ccChanges('${r.id}');apRender()">Request changes</button>`:(r.status==='Client Approval'?`<div class="btnrow"><button class="btn block" onclick="apApprove('${r.id}')">✓ Approve</button></div><button class="btn ghost block" style="margin-top:8px;color:var(--amber)" onclick="ccChanges('${r.id}');apRender()">Request changes</button>`:"")}
  <div class="sub1" style="margin-top:10px;text-align:center">Approval applies to this version only.</div>`;

async function apApprove(id){ await sb.from("cr_content_items").update({status:"Approved",updated_at:new Date().toISOString()}).eq("id",id); const r=AP.find(x=>x.id===id);if(r)r.status="Approved"; toast("Approved"); apRender(); }


/* ============ PROJECTS (kanban) ============ */
const KCOLS=[["To do","To do","#6b7280"],["In Progress","In progress","#2563eb"],["Client Review","Client review","#b4740f"],["Done","Completed","#15803d"]];
let PRJ=[], PRJ_TASKS=[], PRJ_SEL=null;
async function viewProjects(c){
  c.innerHTML=`<div class="ph"><div class="ph-ic">${IC.projects}</div><div><h1>Projects</h1><div class="psub">From brief to delivery, keep every project moving.</div></div><div class="ph-r"><button class="btn ghost">Templates</button>${canStaff()?`<button class="btn" onclick="prNewForm()"><span>${IC.plus}</span> New project</button>`:""}</div></div><div id="pr-body"><div class="psub">Loading…</div></div>`;
  if(!CLIENTS.length){const {data}=await sb.from("cr_profiles").select("id,company,full_name,username").eq("role","client");CLIENTS=data||[];}
  const [p,t]=await Promise.all([sb.from("cr_projects").select("*").order("created_at",{ascending:false}),sb.from("cr_project_tasks").select("*")]);
  PRJ=p.data||[]; PRJ_TASKS=t.data||[]; if(!PRJ_SEL&&PRJ.length)PRJ_SEL=PRJ[0].id;
  prRender();
}
function prRender(){
  const b=$("#pr-body"); if(!b)return;
  const weekEnd=new Date();weekEnd.setDate(weekEnd.getDate()+7);
  const dueWk=PRJ_TASKS.filter(t=>t.due_date&&new Date(t.due_date)<=weekEnd&&new Date(t.due_date)>=new Date()&&t.status!=="Done").length;
  const review=PRJ_TASKS.filter(t=>t.status==="Client Review").length;
  const overdue=PRJ_TASKS.filter(t=>t.due_date&&new Date(t.due_date)<new Date()&&t.status!=="Done").length;
  const proj=PRJ.find(x=>x.id===PRJ_SEL);
  const pt=PRJ_TASKS.filter(t=>t.project_id===PRJ_SEL);
  const done=pt.filter(t=>t.status==="Done").length; const pct=pt.length?Math.round(done/pt.length*100):0;
  const owners=[...new Set(pt.map(t=>t.owner_name).filter(Boolean))];
  b.innerHTML=`<div class="stat-row">${psStat(IC.projects,"#15803d","Active projects",String(PRJ.filter(p=>p.status!=="Completed").length).padStart(2,"0"),"")}${psStat(IC.calendar,"#b4740f","Tasks due this week",String(dueWk).padStart(2,"0"),"")}${psStat(IC.approvals,"#2563eb","Awaiting client input",String(review).padStart(2,"0"),"")}${psStat('<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg>',"#c23b3b","Overdue tasks",String(overdue).padStart(2,"0"),"")}</div>
  <div class="cal-controls"><select class="selectbox" onchange="PRJ_SEL=this.value;prRender()">${PRJ.map(p=>`<option value="${p.id}" ${PRJ_SEL===p.id?'selected':''}>${esc(p.name||"Project")}</option>`).join("")||'<option>No projects</option>'}</select></div>
  ${proj?`<div class="proj-bar"><div class="pm" style="background:linear-gradient(135deg,${avatarColor(proj.name)})">${esc(initials(proj.name)).toUpperCase()}</div><div><h3>${esc(proj.name||"Project")}</h3><div class="sub1">${esc(clientName(proj.client_id))} · ${esc(proj.status||"Active")}</div></div><div class="avstack">${owners.slice(0,3).map(o=>`<span class="a" style="background:linear-gradient(135deg,${avatarColor(o)})">${esc(initials(o)).toUpperCase()}</span>`).join("")}${owners.length>3?`<span class="a" style="background:#9aa4b2">+${owners.length-3}</span>`:""}</div><div style="min-width:220px"><div class="sub1" style="text-align:right;margin-bottom:4px">${done} of ${pt.length} tasks complete</div><div class="prog" style="width:100%"><i style="width:${pct}%"></i></div></div></div>`:""}
  <div class="kb">${KCOLS.map(([st,label,col])=>{const col_t=pt.filter(t=>(t.status||"To do")===st||(st==="In Progress"&&t.status==="Blocked"));return `<div class="kcol"><div class="kcol-h"><span style="color:${col}">●</span> ${label} <span class="ct">(${col_t.length})</span></div>${col_t.map(prCard).join("")}<button class="kadd" onclick="taskForm(PRJ_SEL,'${st}')">+ Add task</button></div>`;}).join("")}</div>
  <div class="mstones">${["Kickoff","Design approval","Development","Testing","Launch"].map((m,i)=>`<div class="ms ${i===0?'ok':'off'}"><div class="mc">${i===0?'✓':i+1}</div><b>${m}</b><span>${i===0?'Completed':'Upcoming'}</span></div>`).join("")}</div>`;
}
function prCard(t){
  const ck=(t.checklist||[]); const ckd=ck.filter(x=>x.done).length;
  return `<div class="kcard" onclick="toast('${esc((t.title||'').replace(/'/g,''))}')"><div class="kt"><span class="kic">${IC.projects}</span><b>${esc(t.title||"Task")}</b></div><div class="kmeta">${t.priority?`<span class="flag ${t.priority}">⚑ ${t.priority}</span>`:""}</div><div class="kmeta">${t.due_date?`<span>📅 ${fmtD(t.due_date)}</span>`:""}${t.owner_name?`<span>· ${esc(t.owner_name)}</span>`:""}</div>${ck.length?`<div class="kmeta"><span>☑ ${ckd}/${ck.length}</span></div>`:""}</div>`;
}

function finProfitTable(limit){
  const m=mKey();

    const rev=FD.inv.filter(i=>i.client_id===c.id&&["Paid","Partially Paid","Issued","Overdue"].includes(i.status)).reduce((s,i)=>s+(Number(i.total)||0),0);
    const direct=FD.exp.filter(e=>e.client_id===c.id).reduce((s,e)=>s+(Number(e.amount)||0),0);
    const payAlloc=FD.pay.reduce((s,p)=>s+(Number(p.direct_alloc)||0),0)/Math.max(1,CLIENTS.length);
    const cost=direct+payAlloc; const gp=rev-cost; const margin=rev?Math.round(gp/rev*100):0;

async function viewAssets(c){

async function asLoad(){ const {data}=await sb.from("cr_assets").select("*").eq("client_id",AS_CLIENT).order("created_at",{ascending:false}); AS=data||[]; if(!AS_FOLDER){const f=[...new Set(AS.map(a=>a.folder).filter(Boolean))]; AS_FOLDER=f[0]||AS_FOLDERS[2];} asRender(); }
function asRender(){
  const b=$("#as-body"); if(!b)return;
  const folders=[...new Set(AS_FOLDERS.concat(AS.map(a=>a.folder).filter(Boolean)))];

  <div class="aw"><div class="card pad"><h3 class="sec-title" style="font-size:15px;margin-bottom:10px">${esc(clientName(AS_CLIENT))}</h3>${folders.map(f=>{const n=AS.filter(a=>(a.folder||AS_FOLDERS[2])===f).length;return `<div class="fold ${AS_FOLDER===f?'on':''}" onclick="AS_FOLDER='${f.replace(/'/g,'')}';AS_SEL=null;asRender()">📁 ${esc(f)} <span class="fc">${n}</span></div>`;}).join("")}<div style="margin-top:12px"><div class="sub1">${(AS.length)} files</div><div class="usebar"><i style="width:${Math.min(100,AS.length*4)}%"></i></div></div></div>
  <div class="card pad"><div class="card-h"><h3 class="sec-title" style="font-size:17px">${esc(AS_FOLDER)}</h3><div class="utabs" style="margin:0;border:0">${[["all","All files"],["approved","Approved"],["working","Working files"]].map(([k,l])=>`<button class="${AS_TAB===k?'on':''}" style="padding:7px 2px;margin-right:16px" onclick="AS_TAB='${k}';asRender()">${l}</button>`).join("")}<span class="sub1">${files.length} files</span></div></div>
   <div class="agrid">${files.map(a=>{const u=a.file_path?supaImg(a.file_path):"";const img=(a.mime_type||"").startsWith("image");return `<div class="acard ${AS_SEL===a.id?'sel':''}" onclick="AS_SEL='${a.id}';asRender()"><div class="ath">${img&&u?`<img src="${esc(u)}">`:'📄'}</div><div class="ab"><b>${esc(a.name||'File')}</b><div class="as">${esc((a.mime_type||'file').split('/')[1]||'').toUpperCase()}</div><span class="status ${a.is_deliverable?'g':'n'}" style="margin-top:6px;display:inline-block;font-size:11px;padding:3px 8px">${a.is_deliverable?'Approved':'Working'}</span></div></div>`;}).join("")||`<div class="sub1" style="grid-column:1/-1;text-align:center;padding:30px">No files in this folder.</div>`}</div></div>

function asDetail(){ const el=$("#as-det"); if(!el)return; const a=AS.find(x=>x.id===AS_SEL);

function crqRender(){

function crqDetail(){ const el=$("#crq-det"); if(!el)return; const r=CRQ.find(x=>x.id===CRQ_SEL);

   ${r.affected_url?`<div class="sub1">Affected page</div><a class="linkg" href="${esc(r.affected_url)}" target="_blank">🔗 ${esc(r.affected_url)}</a>`:""}
   <div style="display:flex;align-items:center;gap:8px;margin:14px 0 8px"><div class="sub1">Scope assessment</div><span class="status ${r.chargeable?'a':'g'}" style="margin-left:auto">${r.chargeable?'Additional work':(r.in_scope?'Within scope':'Not assessed')}</span></div>

  if(!q){el.innerHTML="";el.style.display="none";return;}
  clearTimeout(gTimer); gTimer=setTimeout(async()=>{
    if(!G_CACHE){ const [cl,pr,pp,sp]=await Promise.all([ sb.from("cr_profiles").select("id,company,full_name,industry").eq("role","client"), sb.from("cr_projects").select("id,name,client_name"), sb.from("cr_proposals").select("id,title,client_id"), sb.from("sp_proposals").select("id,title,client_company,share_token") ]); G_CACHE={cl:cl.data||[],pr:pr.data||[],pp:pp.data||[],sp:sp.data||[]}; if(!CLIENTS.length)CLIENTS=G_CACHE.cl; }
    const cl=G_CACHE.cl.filter(c=>((c.company||"")+(c.full_name||"")+(c.industry||"")).toLowerCase().includes(q)).slice(0,5);
    const pr=G_CACHE.pr.filter(p=>((p.name||"")+(p.client_name||"")).toLowerCase().includes(q)).slice(0,5);
    const pp=G_CACHE.pp.filter(p=>(p.title||"").toLowerCase().includes(q)).slice(0,4);
    const sp=G_CACHE.sp.filter(p=>((p.title||"")+(p.client_company||"")).toLowerCase().includes(q)).slice(0,4);
    const row=(ic,t,sub,go)=>`<div class="gi" onclick="${go};document.getElementById('gres').style.display='none';document.getElementById('gsearch').value=''"><span class="av2" style="width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--green)">${ic}</span><div><b style="font-size:13.5px">${esc(t)}</b><div class="sub1">${esc(sub)}</div></div></div>`;
    let h="";
    if(cl.length)h+=`<div class="gt">Clients</div>`+cl.map(c=>row(IC.clients,c.company||c.full_name,c.industry||"Client",`location.hash='#/clients/${c.id}'`)).join("");
    if(pr.length)h+=`<div class="gt">Projects</div>`+pr.map(p=>row(IC.projects,p.name,p.client_name||"",`location.hash='#/projects'`)).join("");
    if(pp.length||sp.length)h+=`<div class="gt">Proposals</div>`+pp.map(p=>row(IC.proposals,p.title,clientName(p.client_id),`location.hash='#/proposals'`)).join("")+sp.map(p=>row("✦",p.title||"Proposal",p.client_company||"",`location.hash='#/proposals'`)).join("");
    el.innerHTML=h||'<div class="gi"><div class="sub1">No matches</div></div>'; el.style.display='';
  },180);
}

/* ============ AUTO-CONVERT accepted proposal -> contract + draft invoice ============ */
async function spAutoConvert(p){
  try{
    const match=CLIENTS.find(c=>(c.company||"").toLowerCase()===(p.client_company||"").toLowerCase());
    if(!match)return;
    // contract (once)
    const {data:ex}=await sb.from("cr_contracts").select("id").eq("client_id",match.id).ilike("title","%"+(p.title||"")+"%").limit(1);
    if(!ex||!ex.length){ await sb.from("cr_contracts").insert({client_id:match.id,title:(p.title||"Agreement").replace(/proposal/i,"agreement"),scope:(p.payload&&(p.payload.solIntro||p.payload.title))||null,payment_schedule:p.total?("Total "+money(p.total,p.currency)):null,status:"draft",version:1,created_by:SESSION.user.id,created_by_name:ME.full_name||ME.email}); }
    // draft invoice (once) — tagged with proposal id in notes
    const {data:inv}=await sb.from("cr_invoices").select("id").ilike("notes","%"+p.id+"%").limit(1);
    if((!inv||!inv.length)&&p.total){ const {data:iv}=await sb.from("cr_invoices").insert({client_id:match.id,kind:"one-time",total:p.total,subtotal:p.total,status:"Draft",notes:"Proposal: "+p.id,created_by:SESSION.user.id,created_by_name:ME.full_name||ME.email}).select().single(); if(iv)await sb.from("cr_invoice_items").insert({invoice_id:iv.id,name:p.title||"Proposal",qty:1,rate:p.total,amount:p.total,sort:0}); }
  }catch(_){ }
}

boot();
