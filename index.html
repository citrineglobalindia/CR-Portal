<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CR Portal — StudioAI Pro | Stepstones Global India</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171a2b; --panel2:#1e2238; --line:#2a2f4a;
    --txt:#e7e9f3; --muted:#9aa0bd; --brand:#6c5ce7; --brand2:#8e7cff;
    --accent:#00d2a8; --danger:#ff6b6b; --warn:#ffb020; --ok:#22c55e;
    --chip:#252a45; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%,rgba(108,92,231,.18),transparent),
    radial-gradient(900px 500px at -10% 110%,rgba(0,210,168,.12),transparent),var(--bg);
    color:var(--txt);min-height:100vh}
  a{color:var(--brand2)}
  .hidden{display:none!important}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:30px;box-shadow:var(--shadow)}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--accent));
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px}
  .logo h1{font-size:18px;margin:0}
  .logo small{color:var(--muted)}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .inp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:11px 12px;border-radius:10px;font-size:14px;outline:none}
  .inp:focus{border-color:var(--brand)}
  .btn{width:100%;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    padding:12px;border-radius:11px;font-weight:700;font-size:15px;margin-top:18px}
  .btn:disabled{opacity:.6}
  .btn-sm{width:auto;padding:8px 14px;font-size:13px;margin:0;border-radius:9px}
  .btn-ghost{background:var(--chip);color:var(--txt);border:1px solid var(--line)}
  .btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .msg{margin-top:14px;font-size:13px;padding:10px;border-radius:9px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(255,107,107,.12);color:#ffb4b4;border:1px solid rgba(255,107,107,.3)}
  .msg.ok{background:rgba(34,197,94,.12);color:#9af5c0;border:1px solid rgba(34,197,94,.3)}
  .setup-note{background:rgba(108,92,231,.12);border:1px solid rgba(108,92,231,.35);color:#cfc6ff;
    padding:10px 12px;border-radius:9px;font-size:12.5px;margin:8px 0 4px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;
    background:rgba(23,26,43,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:30}
  header.top .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .pill{background:var(--chip);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:12px}
  .pill.admin{background:rgba(108,92,231,.2);border-color:var(--brand);color:#cfc6ff}
  .wrap{max-width:1180px;margin:0 auto;padding:22px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .navtabs{display:flex;gap:8px;margin-bottom:18px}
  .navtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px}
  .navtabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .n{font-size:26px;font-weight:800}
  .stat .l{color:var(--muted);font-size:12px;margin-top:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .inp{width:auto}
  .spacer{flex:1}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:rgba(255,255,255,.02)}
  .table-wrap{overflow-x:auto}
  .badge{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;display:inline-block}
  .b-New{background:rgba(154,160,189,.2);color:#c7cbe6}
  .b-InReview{background:rgba(255,176,32,.18);color:#ffd58a}
  .b-Approved{background:rgba(108,92,231,.22);color:#cfc6ff}
  .b-InProgress{background:rgba(0,210,168,.18);color:#86f5db}
  .b-Done{background:rgba(34,197,94,.18);color:#9af5c0}
  .b-Rejected{background:rgba(255,107,107,.18);color:#ffb4b4}
  .pr-High,.pr-Critical{color:#ff9b9b;font-weight:700}
  .pr-Medium{color:#ffd58a}
  .pr-Low{color:#9aa0bd}
  .ref{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);font-weight:700}
  .link-btn{background:none;border:0;color:var(--brand2);font-weight:600;padding:0}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .overlay{position:fixed;inset:0;background:rgba(5,6,15,.7);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
  .modal{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow)}
  .modal .mh{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--line)}
  .modal .mb{padding:22px}
  .modal .x{background:var(--chip);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:9px;font-size:18px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13.5px;margin-bottom:16px}
  .kv .k{color:var(--muted)}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 10px;border-top:1px solid var(--line);padding-top:16px}
  .comment{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
  .comment .meta{font-size:12px;color:var(--muted);margin-bottom:5px}
  .hist{font-size:13px;color:var(--muted);border-left:2px solid var(--brand);padding:4px 0 4px 12px;margin-bottom:8px}
  .att{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:8px 12px;margin-bottom:8px;font-size:13px}
  .att .name{flex:1}
  .photo-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .photo-grid a{display:block}
  .photo-grid img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);padding:12px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:100;
    font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1;bottom:30px}
  .toast.err{border-color:var(--danger)}
  .req{color:var(--danger)}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .pw-wrap{position:relative}
  .pw-wrap .inp{padding-right:46px}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
    font-size:17px;line-height:1;color:var(--muted);padding:6px;cursor:pointer}
  .bell{position:relative;background:var(--chip);border:1px solid var(--line);color:var(--txt);
    width:40px;height:34px;border-radius:9px;font-size:16px}
  .bell-badge{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;font-size:10px;
    font-weight:800;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .notif{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--panel2);cursor:pointer}
  .notif.unread{border-color:var(--brand);background:rgba(108,92,231,.08)}
  .notif .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:5px;flex:0 0 auto}
  .notif.read .dot{background:transparent}
  .notif .nt{font-weight:700;font-size:13.5px}
  .notif .nb{color:var(--muted);font-size:13px;margin-top:2px}
  .notif .nm{color:var(--muted);font-size:11px;margin-top:4px}
  .hero{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .hero .lg{width:60px;height:60px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:var(--panel2)}
  .hero .lg.ph{display:grid;place-items:center;font-weight:800;color:#fff;font-size:22px;
    background:linear-gradient(135deg,var(--brand),var(--accent))}
  .hero .h-name{font-size:18px;font-weight:800}
  .hero .h-sub{color:var(--muted);font-size:13px}
  .clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .client-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start}
  .client-card .lg{width:48px;height:48px;border-radius:11px;object-fit:cover;border:1px solid var(--line);background:var(--panel)}
  .client-card .lg.ph{display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;background:linear-gradient(135deg,var(--brand),var(--accent))}
  .client-card .cc-name{font-weight:700}
  .client-card .cc-meta{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.5;word-break:break-word}
  .logo-preview{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line);margin-top:6px}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);
    cursor:pointer;transition:.15s;background:var(--panel2)}
  .drop:hover,.drop.drag{border-color:var(--brand);color:var(--txt);background:rgba(108,92,231,.08)}
  .drop input{display:none}
  .drop .big{font-size:15px}
  .logo-row{display:flex;align-items:center;gap:14px;margin-top:10px}
  .logo-row img{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--panel)}
  .prefix-preview{margin-top:8px;font-size:13px;color:var(--muted)}
  .prefix-preview .ref{font-size:14px}
  .cc-actions{margin-top:8px}
  .config-warn{max-width:680px;margin:60px auto;background:var(--panel);border:1px solid var(--danger);
    border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  .config-warn h2{margin:0 0 10px;color:#ffb4b4}
  .config-warn code{background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:13px}
</style>
</head>
<body>

<div id="auth-view" class="auth-wrap">
  <div class="auth-card">
    <div class="logo">
      <div class="mark">CR</div>
      <div>
        <h1>Change Request Portal</h1>
        <small>StudioAI Pro · Stepstones Global India</small>
      </div>
    </div>

    <div id="form-login">
      <label>Username or Email</label>
      <input id="li-id" class="inp" placeholder="username or you@company.com" autocomplete="username" />
      <label>Password</label>
      <div class="pw-wrap">
        <input id="li-pass" class="inp" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
        <button type="button" class="pw-eye" onclick="togglePw('li-pass',this)" aria-label="Show password">👁</button>
      </div>
      <button class="btn" id="li-btn" onclick="doLogin()">Log in</button>
    </div>

    <div id="form-setup" class="hidden">
      <div class="setup-note">First-time setup — create the administrator account for this portal.</div>
      <label>Admin email</label>
      <input id="se-email" class="inp" type="email" placeholder="you@company.com" />
      <label>Full name</label>
      <input id="se-name" class="inp" placeholder="Your name" />
      <label>Password <span class="hint">(min 6 characters)</span></label>
      <div class="pw-wrap">
        <input id="se-pass" class="inp" type="password" placeholder="••••••••" />
        <button type="button" class="pw-eye" onclick="togglePw('se-pass',this)" aria-label="Show password">👁</button>
      </div>
      <button class="btn" id="se-btn" onclick="doSetup()">Create admin account</button>
    </div>

    <div id="auth-msg" class="msg"></div>
  </div>
</div>

<div id="app-view" class="hidden">
  <header class="top">
    <div class="logo">
      <div class="mark">CR</div>
      <div><h1 style="font-size:15px">Change Request Portal</h1><small>StudioAI Pro</small></div>
    </div>
    <div class="who">
      <span id="who-name"></span>
      <span id="who-role" class="pill"></span>
      <button class="bell" id="bell" onclick="openNotifs()" title="Notifications">🔔<span id="bell-badge" class="bell-badge hidden">0</span></button>
      <button class="btn btn-sm btn-ghost" onclick="doLogout()">Log out</button>
    </div>
  </header>
  <div class="wrap" id="app-body"></div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// ===================== CONFIG =====================
const SUPABASE_URL = "https://kjegcgnraahyubfnvqte.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZWdjZ25yYWFoeXViZm52cXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNzA1MzksImV4cCI6MjA5Nzk0NjUzOX0.EbuOY5ZW9Xyl6DbKUzwVxxwZqX012Pk2DP4gMp2WVc0";
const CLIENT_LOGIN_DOMAIN = "clients.crportal.app";  // synthetic login domain for username-based clients

const CONFIGURED = SUPABASE_URL.startsWith("https://") && !SUPABASE_KEY.startsWith("REPLACE_");
let sb = null;
if (CONFIGURED) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const AREAS = ["Equipment Tracking","Payments","Billing","Reporting","Dashboard","Settings","Venue","Services","Leads","Requirements","Other"];
const TYPES = ["New Feature","Enhancement","Bug Fix","Removal","Change"];
const PRIORITIES = ["Low","Medium","High","Critical"];
const STATUSES = ["New","In Review","Approved","In Progress","Done","Rejected"];

let ME=null, SESSION=null, CACHE=[], CLIENTS=[], ADMIN_TAB="dashboard";

const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const badgeClass = s => "b-"+String(s||"").replace(/\s/g,"");
const fmtDate = d => d?new Date(d).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const fmtDay  = d => d?new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"—";
const slugify = s => String(s||"").toLowerCase().replace(/[^a-z0-9._-]/g,"");
const codeify = s => String(s||"").replace(/[^A-Za-z0-9]/g,"");
const logoUrl = p => p ? sb.storage.from("cr-logos").getPublicUrl(p).data.publicUrl : "";
const initials = s => (String(s||"?").trim()[0]||"?").toUpperCase();

function toast(msg,isErr){ const t=$("toast"); t.textContent=msg; t.className="toast show"+(isErr?" err":""); setTimeout(()=>t.className="toast",3000); }
function authMsg(msg,type){ const m=$("auth-msg"); m.textContent=msg; m.className="msg show "+(type||"err"); }

async function callFn(name,body){
  const {data,error}=await sb.functions.invoke(name,{body});
  if(error){ let m=error.message; try{const j=await error.context.json(); if(j&&j.error)m=j.error;}catch(_){ } throw new Error(m); }
  if(data&&data.error) throw new Error(data.error);
  return data;
}

// ===================== AUTH =====================
function togglePw(id,btn){ const el=$(id); if(!el)return; const hidden=el.type==="password"; el.type=hidden?"text":"password"; btn.textContent=hidden?"🙈":"👁"; }
async function doLogin(){
  const idv=$("li-id").value.trim(), pass=$("li-pass").value;
  if(!idv||!pass){authMsg("Enter your username/email and password.");return;}
  $("li-btn").disabled=true; $("li-btn").textContent="Logging in…";
  // Resolve username OR notification email OR login email -> auth login email.
  let email=null;
  try{ const {data}=await sb.rpc("cr_resolve_login",{identifier:idv}); if(data) email=data; }catch(_){}
  if(!email){ email = idv.includes("@") ? idv : `${slugify(idv)}@${CLIENT_LOGIN_DOMAIN}`; }
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  $("li-btn").disabled=false; $("li-btn").textContent="Log in";
  if(error){authMsg("Invalid username/email or password.");return;}
  await boot();
}
async function doSetup(){
  const email=$("se-email").value.trim(), name=$("se-name").value.trim(), pass=$("se-pass").value;
  if(!email||pass.length<6){authMsg("Enter an email and a 6+ character password.");return;}
  $("se-btn").disabled=true; $("se-btn").textContent="Creating…";
  try{
    await callFn("bootstrap-admin",{email,password:pass,full_name:name});
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error) throw error;
    await boot();
  }catch(e){ authMsg(e.message||"Setup failed."); }
  finally{ $("se-btn").disabled=false; $("se-btn").textContent="Create admin account"; }
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

async function ensureProfile(){
  const u=SESSION.user;
  const {data:prof}=await sb.from("cr_profiles").select("*").eq("id",u.id).maybeSingle();
  ME=prof;
}

async function boot(){
  if(!CONFIGURED){ showConfigWarning(); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    let needs=false;
    try{ const {data}=await sb.rpc("cr_needs_setup"); needs=!!data; }catch(_){}
    $("app-view").classList.add("hidden");
    $("auth-view").classList.remove("hidden");
    $("form-setup").classList.toggle("hidden",!needs);
    $("form-login").classList.toggle("hidden",needs);
    if(needs) $("se-email").value="stepstonesdigital@gmail.com";
    return;
  }
  SESSION=session;
  await ensureProfile();
  if(!ME){ toast("No profile found for this account.",true); await sb.auth.signOut(); location.reload(); return; }
  $("auth-view").classList.add("hidden");
  $("app-view").classList.remove("hidden");
  $("who-name").textContent=ME.company||ME.full_name||ME.username||ME.email;
  $("who-role").textContent=ME.role==="admin"?"ADMIN":"CLIENT";
  $("who-role").className="pill"+(ME.role==="admin"?" admin":"");
  if(ME.role==="admin") renderAdmin(); else renderClient();
  startNotifPolling();
}

function showConfigWarning(){
  $("auth-view").classList.add("hidden");
  document.body.insertAdjacentHTML("beforeend",
    `<div class="config-warn"><h2>⚠ Supabase not configured</h2><p>Set <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> in index.html.</p></div>`);
}

// ===================== DATA =====================
async function loadRequests(){
  const {data,error}=await sb.from("cr_requests").select("*").order("created_at",{ascending:false});
  if(error){toast(error.message,true);return [];}
  CACHE=data||[]; return CACHE;
}
async function loadClients(){
  const {data,error}=await sb.from("cr_profiles").select("*").eq("role","client").order("created_at",{ascending:false});
  if(error){toast(error.message,true);return [];}
  CLIENTS=data||[]; return CLIENTS;
}

// ===================== CLIENT VIEW =====================
function renderClient(){
  const lg=logoUrl(ME.logo_path);
  $("app-body").innerHTML=`
    <div class="hero">
      ${lg?`<img class="lg" src="${esc(lg)}" alt="logo"/>`:`<div class="lg ph">${esc(initials(ME.company||ME.full_name||ME.username))}</div>`}
      <div>
        <div class="h-name">${esc(ME.company||ME.full_name||ME.username||"Welcome")}</div>

async function submitCR(){
  const title=$("f-title").value.trim(), desc=$("f-desc").value.trim();
  if(!title||!desc){toast("Heading and description are required.",true);return;}
  const btn=$("submit-cr"); btn.disabled=true; btn.textContent="Submitting…";
  const payload={ title, area:$("f-area").value, type:"Change", priority:$("f-priority").value,
    item_count:1, description:desc, created_by:SESSION.user.id,
    client_name:ME.company||ME.full_name||ME.username, status:"New" };
  const {data,error}=await sb.from("cr_requests").insert(payload).select().single();
  if(error){btn.disabled=false;btn.textContent="Submit Change Request";toast(error.message,true);return;}
  for(const f of $("f-files").files){ await uploadAttachment(data.id,f); }
  await sb.from("cr_status_history").insert({request_id:data.id,old_status:null,new_status:"New",
    changed_by:SESSION.user.id,changed_by_name:ME.full_name||ME.username,note:"Request submitted"});
  notify("new_cr",data.id).catch(()=>{});
  btn.disabled=false; btn.textContent="Submit Change Request";
  $("f-title").value="";$("f-desc").value="";$("f-files").value="";$("file-preview").innerHTML="";
  toast("Change request "+data.ref_no+" submitted.");
  loadAndRenderClient();
}
async function uploadAttachment(reqId,file){
  const path=`${reqId}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,"_")}`;
  const {error}=await sb.storage.from("cr-attachments").upload(path,file);
  if(error){toast("Upload failed: "+error.message,true);return;}
  await sb.from("cr_attachments").insert({request_id:reqId,file_name:file.name,file_path:path,
    file_size:file.size,mime_type:file.type,uploaded_by:SESSION.user.id});
}

// Reusable drag-and-drop image picker.
function initDrop(dropId,inputId,rowId,imgId,onPick){
  const d=$(dropId), inp=$(inputId); if(!d||!inp) return;
  const pick=f=>{ if(!f) return; if(!f.type.startsWith("image/")){toast("Please choose an image file.",true);return;}
    onPick(f); const img=$(imgId); if(img){img.src=URL.createObjectURL(f);img.classList.remove("hidden");} const row=$(rowId); if(row) row.classList.remove("hidden"); };
  d.onclick=()=>inp.click();
  d.ondragover=e=>{e.preventDefault();d.classList.add("drag");};
  d.ondragleave=()=>d.classList.remove("drag");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("drag");pick(e.dataTransfer.files[0]);};
  inp.onchange=()=>pick(inp.files[0]);
}

  try{
    let logo_base64=null, logo_name=null, logo_type=null;
    if(LOGO_FILE){ logo_base64=await readAsBase64(LOGO_FILE); logo_name=LOGO_FILE.name; logo_type=LOGO_FILE.type||"image/png"; }
    await callFn("admin-create-client",{ username, password:pass, email, full_name:name,
      company, phone:$("cl-phone").value.trim(), address:$("cl-address").value.trim(),
      gst_no:$("cl-gst").value.trim(), website:$("cl-web").value.trim(), client_code:code, cr_prefix:prefix,
      logo_base64, logo_name, logo_type });
    toast(`Client "${company}" created. Login: ${username}`);
    ["cl-name","cl-company","cl-code","cl-prefix","cl-username","cl-pass","cl-email","cl-phone","cl-gst","cl-web","cl-address"].forEach(i=>$(i).value="");
    $("cl-code").dataset.touched=""; $("cl-prefix").dataset.touched=""; clearLogo(); updatePrefixPreview();
    await loadClients(); renderClientsList();
  }catch(e){ toast(e.message||"Could not create client.",true); }
  finally{ btn.disabled=false; btn.textContent="Create client account"; }
}

// ===================== DETAIL MODAL =====================
async function openDetail(id){
  const r=CACHE.find(x=>x.id===id); if(!r)return;
  const [{data:comments},{data:hist},{data:atts}]=await Promise.all([
    sb.from("cr_comments").select("*").eq("request_id",id).order("created_at"),
    sb.from("cr_status_history").select("*").eq("request_id",id).order("created_at"),
    sb.from("cr_attachments").select("*").eq("request_id",id).order("created_at")
  ]);
  const isAdmin=ME.role==="admin";
  const imgs=(atts||[]).filter(a=>(a.mime_type||"").startsWith("image/"));
  const files=(atts||[]).filter(a=>!(a.mime_type||"").startsWith("image/"));
  $("modal-root").innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="mh">
        <div><div class="ref" style="font-size:15px">${esc(r.ref_no)}</div>
          <h2 style="margin:4px 0 0">${esc(r.title)}</h2></div>
        <button class="x" onclick="closeModal()">×</button>
      </div>
      <div class="mb">
        <div class="kv">
          <div class="k">Client</div><div>${esc(r.client_name||"—")}</div>
          <div class="k">Priority</div><div class="pr-${r.priority}">${esc(r.priority)}</div>
          <div class="k">Status</div><div><span class="badge ${badgeClass(r.status)}">${esc(r.status)}</span></div>
          <div class="k">Submitted</div><div>${fmtDate(r.created_at)}</div>
        </div>
        <div><div class="k" style="color:var(--muted);font-size:13px;margin-bottom:4px">Description</div>
          <div style="white-space:pre-wrap;font-size:14px;line-height:1.5">${esc(r.description||"")}</div></div>
        ${imgs.length?`<div class="section-title">Photos (${imgs.length})</div><div class="photo-grid" id="photo-grid"></div>`:""}
        ${isAdmin?`<div class="section-title">Update status</div>
        ${r.status!=="Done"?`<button class="btn btn-sm btn-ok" style="margin-bottom:10px" onclick="completeCR('${r.id}')">✓ Mark as Completed</button>`:""}
        <div class="row">
          <select id="d-status" class="inp" style="max-width:200px">${STATUSES.map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select>
          <input id="d-status-note" class="inp" placeholder="Optional note…" style="flex:1"/>
          <button class="btn btn-sm" onclick="saveStatus('${r.id}')">Save</button>
        </div>`:""}
        ${(!isAdmin && r.status==="Done")?`<div class="section-title">Not completed?</div>
        <button class="btn btn-sm btn-ghost" onclick="reopenCR('${r.id}')">↺ Mark as not completed (reopen)</button>
        <div class="hint">This reopens the request and notifies the team to look again.</div>`:""}
        ${files.length?`<div class="section-title">Attachments (${files.length})</div>
        <div>${files.map(a=>`<div class="att"><span>📎</span><span class="name">${esc(a.file_name)}</span>
          <button class="btn btn-sm btn-ghost" onclick="downloadAtt('${esc(a.file_path)}','${esc(a.file_name)}')">Download</button></div>`).join("")}</div>`:""}
        <div class="section-title">Status history</div>
        <div>${(hist||[]).map(h=>`<div class="hist">${h.old_status?esc(h.old_status)+" → ":""}<strong>${esc(h.new_status)}</strong> · ${esc(h.changed_by_name||"")} · ${fmtDate(h.created_at)}${h.note?`<br><em>${esc(h.note)}</em>`:""}</div>`).join("")||'<div class="hint">No history.</div>'}</div>
        <div class="section-title">Comments (${(comments||[]).length})</div>
        <div id="cmt-list">${(comments||[]).map(c=>`<div class="comment"><div class="meta"><strong>${esc(c.author_name||"")}</strong> <span class="pill" style="font-size:10px">${esc((c.author_role||"").toUpperCase())}</span> · ${fmtDate(c.created_at)}</div>${esc(c.body)}</div>`).join("")||'<div class="hint">No comments yet.</div>'}</div>
        <div class="row" style="margin-top:10px">
          <input id="d-comment" class="inp" placeholder="Add a comment…" style="flex:1" onkeydown="if(event.key==='Enter')addComment('${r.id}')"/>
          <button class="btn btn-sm" onclick="addComment('${r.id}')">Post</button>
        </div>
      </div>
    </div>
  </div>`;
  if(imgs.length){
    const g=$("photo-grid");
    for(const a of imgs){
      const {data}=await sb.storage.from("cr-attachments").createSignedUrl(a.file_path,600);
      if(data&&data.signedUrl){ const wrap=document.createElement("a"); wrap.href=data.signedUrl; wrap.target="_blank"; wrap.rel="noopener";
        const im=document.createElement("img"); im.src=data.signedUrl; im.alt=a.file_name; wrap.appendChild(im); g.appendChild(wrap); }
    }
  }
}
function closeModal(){ $("modal-root").innerHTML=""; }
async function saveStatus(id){
  const r=CACHE.find(x=>x.id===id);
  const ns=$("d-status").value, note=$("d-status-note").value.trim();
  if(ns!==r.status){
    const old=r.status;
    const {error}=await sb.from("cr_requests").update({status:ns}).eq("id",id);
    if(error){toast(error.message,true);return;}
    await sb.from("cr_status_history").insert({request_id:id,old_status:old,new_status:ns,
      changed_by:SESSION.user.id,changed_by_name:ME.full_name,note:note||"Status updated"});
    notify("status",id,ns).catch(()=>{});
    r.status=ns; r.updated_at=new Date().toISOString();
  }else if(note){
    await sb.from("cr_status_history").insert({request_id:id,old_status:r.status,new_status:r.status,
      changed_by:SESSION.user.id,changed_by_name:ME.full_name,note});
  }
  toast("Saved."); openDetail(id);
  ME.role==="admin"?renderAdminTable():renderClientTable();
}
async function addComment(id){
  const body=$("d-comment").value.trim(); if(!body)return;
  const {error}=await sb.from("cr_comments").insert({request_id:id,author_id:SESSION.user.id,
    author_name:ME.full_name||ME.username||ME.email,author_role:ME.role,body});
  if(error){toast(error.message,true);return;}
  openDetail(id);
}
async function downloadAtt(path,name){
  const {data,error}=await sb.storage.from("cr-attachments").createSignedUrl(path,120);
  if(error){toast(error.message,true);return;}
  const a=document.createElement("a"); a.href=data.signedUrl; a.download=name; a.target="_blank"; a.click();
}

// ===================== EMAIL NOTIFICATIONS =====================
// Best-effort; activates once the send-notification edge function + Gmail secret are set up.
async function notify(kind,requestId,newStatus){
  try{ await sb.functions.invoke("send-notification",{body:{kind,request_id:requestId,new_status:newStatus||null}}); }catch(_){}
}

// ===================== IN-PORTAL NOTIFICATIONS =====================
let NOTIFS=[], NOTIF_TIMER=null;
function unreadCount(){ return NOTIFS.filter(n=>!n.is_read).length; }
function updateBadge(){
  const b=$("bell-badge"); if(!b) return;
  const n=unreadCount(); b.textContent=n>99?"99+":String(n); b.classList.toggle("hidden",n===0);
}
async function loadNotifs(){
  const {data}=await sb.from("cr_notifications").select("*").order("created_at",{ascending:false}).limit(40);
  NOTIFS=data||[]; updateBadge(); return NOTIFS;
}
function startNotifPolling(){
  if(NOTIF_TIMER) clearInterval(NOTIF_TIMER);
  loadNotifs();
  NOTIF_TIMER=setInterval(async ()=>{
    const before=unreadCount(); await loadNotifs(); const after=unreadCount();
    if(after>before){ const latest=NOTIFS.find(n=>!n.is_read); toast("🔔 "+(latest?latest.title:"New notification")); }
  },30000);
}
async function openNotifs(){
  await loadNotifs();
  $("modal-root").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:520px">
      <div class="mh"><div><h2 style="margin:0">Notifications</h2><div class="hint">${unreadCount()} unread</div></div>
        <div style="display:flex;gap:8px;align-items:flex-start">
          ${NOTIFS.some(n=>!n.is_read)?`<button class="btn btn-sm btn-ghost" onclick="markAllRead()">Mark all read</button>`:""}
          <button class="x" onclick="closeModal()">×</button></div></div>
      <div class="mb">${NOTIFS.length?NOTIFS.map(n=>`
        <div class="notif ${n.is_read?'read':'unread'}" onclick="openNotif('${n.id}','${n.request_id||''}')">
          <div class="dot"></div>
          <div><div class="nt">${esc(n.title||'')}</div><div class="nb">${esc(n.body||'')}</div>
          <div class="nm">${fmtDate(n.created_at)}</div></div>
        </div>`).join(""):`<div class="empty">No notifications yet.</div>`}</div>
    </div></div>`;
}
async function markRead(id){
  await sb.from("cr_notifications").update({is_read:true}).eq("id",id);
  const n=NOTIFS.find(x=>x.id===id); if(n) n.is_read=true; updateBadge();
}
async function markAllRead(){
  await sb.from("cr_notifications").update({is_read:true}).eq("is_read",false);
  NOTIFS.forEach(n=>n.is_read=true); updateBadge(); openNotifs();
}
async function openNotif(id,reqId){
  await markRead(id);
  if(reqId){ if(!CACHE.length) await loadRequests(); closeModal(); openDetail(reqId); }
  else openNotifs();
}

// ===================== EXPORTS =====================
function exportRows(){ return ME.role==="admin"?filteredAdmin():CACHE; }
function exportData(){
  return exportRows().map(r=>({
    Ref:r.ref_no, Heading:r.title, Client:r.client_name||"", Priority:r.priority,
    Status:r.status, Description:r.description||"", Submitted:fmtDay(r.created_at), Updated:fmtDay(r.updated_at)
  }));
}
function exportExcel(){
  const ws=XLSX.utils.json_to_sheet(exportData());
  ws["!cols"]=[{wch:16},{wch:34},{wch:20},{wch:9},{wch:12},{wch:50},{wch:13},{wch:13}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Change Requests");
  XLSX.writeFile(wb,`Change_Requests_${new Date().toISOString().slice(0,10)}.xlsx`); toast("Excel exported.");
}
function exportCSV(){
  const rows=exportData(); const head=Object.keys(rows[0]||{Ref:"",Heading:"",Client:"",Priority:"",Status:"",Description:"",Submitted:"",Updated:""});
  const csv=[head.join(","),...rows.map(r=>head.map(h=>`"${String(r[h]).replace(/"/g,'""')}"`).join(","))].join("\n");
  dl(new Blob([csv],{type:"text/csv"}),`Change_Requests_${new Date().toISOString().slice(0,10)}.csv`); toast("CSV exported.");
}
function exportPDF(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:"landscape"});
  doc.setFontSize(16); doc.text("Software Change Requests — StudioAI Pro",14,16);
  doc.setFontSize(10); doc.setTextColor(120);
  doc.text(`Stepstones Global India · Generated ${fmtDay(new Date())} · ${exportRows().length} items`,14,23);
  doc.autoTable({ startY:28, styles:{fontSize:8,cellPadding:2}, headStyles:{fillColor:[108,92,231]},
    head:[["Ref","Heading","Client","Pri.","Status","Submitted"]],
    body:exportRows().map(r=>[r.ref_no,r.title,r.client_name||"",r.priority,r.status,fmtDay(r.created_at)]),
    columnStyles:{1:{cellWidth:70}} });
  doc.save(`Change_Requests_${new Date().toISOString().slice(0,10)}.pdf`); toast("PDF exported.");
}
function exportWord(){
  const rows=exportRows();
  const cells=rows.map(r=>`<tr><td>${esc(r.ref_no)}</td><td>${esc(r.title)}</td><td>${esc(r.client_name||"")}</td>
    <td>${esc(r.priority)}</td><td>${esc(r.status)}</td><td>${fmtDay(r.created_at)}</td><td>${esc(r.description||"")}</td></tr>`).join("");
  const html=`<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'>
  <style>body{font-family:Calibri,Arial} h1{color:#4b2bd6} table{border-collapse:collapse;width:100%;font-size:10pt}
  th,td{border:1px solid #999;padding:5px;vertical-align:top} th{background:#6c5ce7;color:#fff;text-align:left}</style></head>
  <body><h1>Software Change Requests — StudioAI Pro</h1>
  <p><b>Stepstones Global India</b> · Generated ${fmtDay(new Date())} · ${rows.length} change requests</p>
  <table><thead><tr><th>Ref</th><th>Heading</th><th>Client</th><th>Priority</th><th>Status</th><th>Submitted</th><th>Description</th></tr></thead>
  <tbody>${cells}</tbody></table></body></html>`;
  dl(new Blob(["﻿"+html],{type:"application/msword"}),`Change_Requests_${new Date().toISOString().slice(0,10)}.doc`); toast("Word exported.");
}
function dl(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }

if(sb) sb.auth.onAuthStateChange((_e,s)=>{SESSION=s;});
boot();
