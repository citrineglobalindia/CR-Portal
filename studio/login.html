<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stepstones — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{--gold:#f4c430;--gold-hi:#fcd146;--bg:#0b0b0d;--card:#161618;--line:#2a2a2e;--input:#0e0e10;--text:#fff;--mute:rgba(255,255,255,.6)}
  body{font-family:'Inter Tight',system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:radial-gradient(1200px 600px at 80% -10%, rgba(244,196,48,0.08), transparent 60%),radial-gradient(900px 600px at -10% 110%, rgba(244,196,48,0.05), transparent 60%);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:48px 40px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .logo{display:flex;gap:12px;align-items:center;margin-bottom:36px}
  .logo .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#e6a800);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1100;font-size:22px;font-family:'Fraunces',serif}
  .logo .nm{font-weight:700;font-size:18px;line-height:1.1}
  .logo .sub{font-size:11px;opacity:.55;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:34px;margin:0 0 6px;letter-spacing:-.01em}
  .lead{opacity:.65;margin:0 0 28px;font-size:15px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;margin:16px 0 7px;font-weight:600}
  input{width:100%;padding:13px 15px;background:var(--input);border:1px solid var(--line);border-radius:11px;color:var(--text);font-size:15px;font-family:inherit;transition:border-color .15s}
  input:focus{outline:none;border-color:var(--gold)}
  .btn{width:100%;padding:14px;background:var(--gold);color:#1a1100;border:0;border-radius:12px;font-weight:700;cursor:pointer;margin-top:28px;font-size:15px;transition:background .15s;font-family:inherit}
  .btn:hover{background:var(--gold-hi)}
  .btn:disabled{opacity:.5;cursor:wait}
  .err{color:#ff8585;font-size:13px;margin-top:14px;min-height:18px}
  .meta{font-size:12.5px;opacity:.5;margin-top:22px;text-align:center;line-height:1.5}
  .meta a{color:var(--gold);text-decoration:none}
  .meta a:hover{text-decoration:underline}
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="logo">
      <div class="mark">C</div>
      <div><div class="nm">Stepstones</div><div class="sub">Proposal Studio</div></div>
    </div>
    <h1>Sign in</h1>
    <p class="lead">Access the proposal portal.</p>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@stepstones.in">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    <button type="submit" class="btn" id="signinBtn">Sign in</button>
    <div class="err" id="err"></div>
    <div class="meta">No account? Ask an admin for an invite.</div>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sp-config.js"></script>
<script>
const sb = window.supabase.createClient(SP_CFG.URL, SP_CFG.KEY);

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const next = new URLSearchParams(location.search).get('next');
    location.replace(next || './dashboard.html');
  }
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signinBtn');
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in…';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = error.message;
    btn.disabled = false; btn.textContent = 'Sign in';
    return;
  }
  const next = new URLSearchParams(location.search).get('next');
  location.replace(next || './dashboard.html');
});
</script>
</body>
</html>
